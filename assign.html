<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>アサイン管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --green:#2e7d32; --line:#e0e0e0; --bg:#f7f8f7; --ink:#222; --sub:#666;
         --red:#c62828; --redbg:#ffebee; --amber:#a06a00; --amberbg:#fff8e1; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  .wrap{ max-width:640px; margin:0 auto; padding:14px 14px 40px; }
  h1{ font-size:18px; margin:4px 0 2px; display:flex; align-items:center; gap:8px; }
  .lead{ color:var(--sub); font-size:12px; margin:0 0 10px; }
  .msg{ font-size:13px; margin:10px 0; white-space:pre-wrap; }
  .msg.err{ color:var(--red); background:var(--redbg); border:1px solid #ef9a9a;
            border-radius:10px; padding:12px; }
  .center{ text-align:center; color:var(--sub); font-size:13px; padding:24px 8px; }

  /* タブ */
  .tabs{ display:flex; gap:6px; margin:0 0 12px; }
  .tabs button{ flex:1; padding:10px 6px; font-size:13px; font-weight:700; font-family:inherit;
    border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:10px; }
  .tabs button.on{ background:var(--green); border-color:var(--green); color:#fff; }

  /* 絞り込み */
  .filt{ background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:10px 12px; margin-bottom:12px; }
  .filt .r{ display:flex; align-items:center; gap:8px; margin:6px 0; }
  .filt .r:first-child{ margin-top:0; }
  .filt label{ font-size:12px; color:var(--sub); white-space:nowrap; min-width:52px; }
  .filt select{ flex:1; padding:8px; font-size:14px; font-family:inherit;
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  .filt .chk{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; }
  .filt .chk input{ width:20px; height:20px; accent-color:#c62828; }

  /* サマリ */
  .sum{ display:flex; gap:8px; margin:0 0 6px; }
  .sum > div{ flex:1; background:#fff; border:1px solid var(--line); border-radius:12px;
              padding:10px 8px; text-align:center; }
  .sum b{ display:block; font-size:22px; line-height:1.2; }
  .sum span{ font-size:11px; color:var(--sub); }
  .sum .bad b{ color:var(--red); }
  .sum .warn b{ color:var(--amber); }

  .area{ margin:20px 0 8px; font-size:14px; font-weight:700;
         display:flex; align-items:center; gap:8px; }
  .area .cnt{ font-weight:400; font-size:12px; color:var(--sub); }
  .grp{ margin:14px 0 6px; font-size:13px; font-weight:700; }
  .grp.bad{ color:var(--red); } .grp.warn{ color:var(--amber); } .grp.ok{ color:var(--green); }

  .job{ background:#fff; border:1px solid var(--line); border-radius:12px;
        padding:11px 12px; margin-bottom:8px; }
  .job.bad{ border-color:#ef9a9a; background:#fffafa; }
  .job.past{ opacity:.62; }
  .job .top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .job .d{ font-size:13px; font-weight:700; }
  .job .d .today{ color:#fff; background:var(--green); border-radius:6px;
                  font-size:10px; padding:1px 6px; margin-left:6px; }
  .job .p{ font-size:14px; font-weight:700; flex:1; min-width:120px; }
  .job .t{ font-size:12px; color:var(--sub); }
  .job .rows{ margin-top:7px; display:grid; grid-template-columns:auto 1fr; gap:3px 8px;
              font-size:12.5px; align-items:baseline; }
  .job .k{ color:var(--sub); white-space:nowrap; }
  .job .v.none{ color:var(--red); font-weight:700; }
  .job .memo{ margin-top:6px; font-size:12px; color:var(--sub);
              background:var(--amberbg); border-radius:8px; padding:6px 8px; }
  /* ★v7.36 未アサイン行の「この日シフトを出している人」 */
  .cand{ margin-top:8px; font-size:12px; color:#1b5e20; background:#e8f5e9;
         border:1px solid #a5d6a7; border-radius:8px; padding:7px 9px; font-weight:700; }
  .cand.none{ color:#8d6e63; background:#fafafa; border-color:var(--line); font-weight:400; }
  .cand .chips{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .cand .chip{ display:inline-block; background:#fff; border:1px solid #a5d6a7;
               border-radius:999px; padding:3px 10px; font-weight:700; color:#222; }
  .cand .chip i{ font-style:normal; margin-left:5px; font-size:10px; font-weight:700;
                 color:#a06a00; background:var(--amberbg); border-radius:5px; padding:0 5px; }
  /* ★v7.36 スタッフの提出シフト（日付そのもの） */
  .days{ display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
  .days span{ font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:#333; }
  .days span.sat{ color:#1565c0; border-color:#90caf9; background:#e3f2fd; }
  .days span.sun{ color:#c62828; border-color:#ef9a9a; background:var(--redbg); }
  /* ★v7.42 別日のチェック専用カード */
  .job.chk{ background:#f8fbff; border-color:#bbdefb; }
  .tag{ display:inline-block; font-size:11px; border-radius:6px; padding:1px 6px;
        margin-left:6px; border:1px solid var(--line); color:var(--sub); }
  .tag.sd{ color:#b71c1c; border-color:#ef9a9a; background:var(--redbg); }

  /* スタッフ */
  .st{ background:#fff; border:1px solid var(--line); border-radius:12px;
       padding:11px 12px; margin-bottom:8px; }
  .st.off{ opacity:.55; }
  .st .n{ font-size:14px; font-weight:700; }
  .st .rows{ margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:3px 8px;
             font-size:12.5px; align-items:baseline; }
  .st .k{ color:var(--sub); white-space:nowrap; }
  .badge{ display:inline-block; font-size:11px; border-radius:6px; padding:1px 7px; margin-left:7px; }
  .badge.tr{ background:var(--amberbg); color:var(--amber); border:1px solid #ffe082; }
  .badge.so{ background:#e8f5e9; color:var(--green); border:1px solid #a5d6a7; }
  .badge.ng{ background:var(--redbg); color:var(--red); border:1px solid #ef9a9a; }
  .badge.ck{ background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; }  /* ★v7.42 別日のチェック */

  /* ★v7.50 案E スタッフ別ルート */
  .strip{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; }
  .strip .dd{ flex:0 0 auto; width:54px; border:1px solid var(--line); border-radius:11px;
              padding:6px 0 5px; text-align:center; background:#fff; cursor:pointer; }
  .strip .dd .w{ font-size:10.5px; color:var(--sub); font-weight:700; }
  .strip .dd .n{ font-size:17px; font-weight:800; line-height:1.25; }
  .strip .dd .m{ font-size:10px; color:var(--sub); }
  .strip .dd.sat .n{ color:#1565c0; } .strip .dd.sun .n{ color:var(--red); }
  .strip .dd.on{ background:var(--green); border-color:var(--green); }
  .strip .dd.on .n,.strip .dd.on .w,.strip .dd.on .m{ color:#fff; }
  .strip .pips{ display:flex; justify-content:center; gap:3px; margin-top:3px; height:7px; }
  .pip{ display:inline-block; width:7px; height:7px; border-radius:50%; }
  .pip.r{ background:var(--red); } .pip.y{ background:#f9a825; }
  .dayhd{ font-size:17px; font-weight:800; margin:6px 0 8px; }
  .dayhd small{ font-size:12px; color:var(--sub); font-weight:600; margin-left:8px; }
  .dayhd .today{ color:#fff; background:var(--green); border-radius:6px;
                 font-size:10px; padding:2px 7px; margin-left:7px; vertical-align:middle; }
  .tray{ background:#fff; border:2px dashed #ef9a9a; border-radius:12px; padding:9px 10px; margin-bottom:10px; }
  .tray .th{ font-size:12px; font-weight:800; color:var(--red); margin:0 0 7px; }
  .tray .th.y{ color:var(--amber); margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); }
  .tcard{ display:flex; align-items:center; gap:9px; background:var(--redbg); border:1px solid #ffcdd2;
          border-radius:9px; padding:8px 10px; margin-bottom:6px; cursor:pointer; }
  .tcard.y{ background:var(--amberbg); border-color:#ffe082; }
  .tcard:last-child{ margin-bottom:0; }
  .tcard .p{ font-weight:800; font-size:13.5px; flex:1; min-width:0; }
  .tcard .p small{ display:block; font-weight:400; font-size:11px; color:#8d6e63; }
  .tcard .n{ font-size:11px; font-weight:800; color:var(--red); white-space:nowrap; text-align:right; }
  .tcard.y .n{ color:var(--amber); }
  .tcard .n em{ display:block; font-style:normal; font-size:10px; font-weight:400; color:var(--sub); }
  .lane{ background:#fff; border:1px solid var(--line); border-radius:13px; overflow:hidden; margin-bottom:9px; }
  .lane>.hd{ display:flex; align-items:center; gap:7px; padding:9px 11px; background:#f7f8f7;
             border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .lane>.hd .nm{ font-weight:800; font-size:14.5px; }
  .lane>.hd .sum{ margin-left:auto; font-size:11.5px; color:var(--sub); font-weight:700; }
  .lane>.hd .mv{ font-size:11px; color:var(--sub); border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .badge.ot{ background:#eef0f2; color:#4b5563; border:1px solid #d3d7dc; }
  .lane .body{ padding:9px 10px; }
  .stop{ display:flex; gap:9px; align-items:flex-start; cursor:pointer; }
  .stop+.stop{ margin-top:6px; }
  .stop .tm{ width:46px; flex:0 0 auto; text-align:right; font-size:12px; font-weight:800;
             color:#374151; padding-top:9px; }
  .stop .tm small{ display:block; font-weight:400; font-size:10.5px; color:var(--sub); }
  .stop .bx{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px;
             padding:8px 10px; background:#fff; }
  .stop.g .bx{ border-left:4px solid var(--green); }
  .stop.y .bx{ border-left:4px solid #f9a825; }
  .stop.b .bx{ border-left:4px solid #1565c0; background:#f8fbff; }
  .stop .bx .p{ font-weight:800; font-size:13.5px; }
  .stop .bx .d{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .hop{ display:flex; gap:9px; align-items:center; margin:5px 0; }
  .hop .tm{ width:46px; flex:0 0 auto; }
  .hop .ln{ flex:1; display:flex; align-items:center; gap:7px; font-size:11px;
            color:var(--sub); font-weight:700; }
  .hop .ln:before,.hop .ln:after{ content:''; height:1px; background:var(--line); flex:1; }
  .sec2{ margin:16px 0 7px; font-size:12px; font-weight:800; color:var(--sub); }
  .freerow{ display:flex; flex-wrap:wrap; gap:6px; }
  .fchip{ background:#fff; border:1px solid var(--line); border-radius:999px;
          padding:5px 12px; font-size:12.5px; font-weight:700; }
  .fchip i{ font-style:normal; margin-left:5px; font-size:10px; color:var(--amber);
            background:var(--amberbg); border-radius:5px; padding:0 5px; }
  .fchip u{ text-decoration:none; margin-left:5px; font-size:11px; font-weight:400; color:var(--sub); }

  /* ★v7.45 担当を決めるシート（段2） */
  .ovl{ position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:50;
        display:none; align-items:flex-end; }
  .ovl.on{ display:flex; }
  .sheet{ background:#fff; width:100%; max-height:92vh; overflow-y:auto;
          border-radius:16px 16px 0 0; }
  .sheet .hd{ position:sticky; top:0; background:#fff; padding:14px 16px 10px;
              border-bottom:1px solid var(--line); }
  .sheet .hd b{ font-size:16px; }
  .sheet .hd small{ display:block; color:var(--sub); font-size:12px; font-weight:400; margin-top:2px; }
  .sheet .sec{ padding:12px 16px; border-bottom:1px solid #f0f1f3; }
  .sheet .lb{ font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:7px; }
  .pills{ display:flex; flex-wrap:wrap; gap:7px; }
  .pill{ border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13.5px;
         font-weight:700; background:#fff; color:#333; font-family:inherit; cursor:pointer; }
  .pill.on{ background:#f1f8f2; border-color:var(--green); color:var(--green);
            box-shadow:inset 0 0 0 1px var(--green); }
  .pill i{ font-style:normal; margin-left:5px; font-size:10.5px; color:var(--amber);
           background:var(--amberbg); border-radius:5px; padding:0 5px; }
  .pill.off{ opacity:.45; }
  .stp{ display:flex; align-items:center; gap:10px; }
  .stp button{ width:44px; height:40px; border:1px solid var(--line); border-radius:10px;
               background:#fff; font-size:19px; font-weight:800; color:#333; font-family:inherit; }
  .stp .v{ flex:1; text-align:center; font-size:17px; font-weight:800; }
  .stp .v small{ display:block; font-size:11px; color:var(--sub); font-weight:600; }
  .box{ border-radius:10px; padding:9px 11px; font-size:12.5px; font-weight:700; }
  .box.ok{ background:#e8f5e9; border:1px solid #a5d6a7; color:#1b5e20; }
  .box.ng{ background:var(--redbg); border:1px solid #ef9a9a; color:#7f1d1d; white-space:pre-wrap; }
  .box.info{ background:#e3f2fd; border:1px solid #90caf9; color:#0d47a1; }
  .bar{ position:sticky; bottom:0; background:#fafbfc; border-top:1px solid var(--line);
        display:flex; gap:9px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar button{ flex:1; border:0; border-radius:11px; padding:13px; font-size:15px;
               font-weight:800; font-family:inherit; }
  .bar .c{ background:#fff; color:#333; border:1px solid var(--line); }
  .bar .s{ background:var(--green); color:#fff; }
  .bar .s:disabled{ background:#a5d6a7; }
  .job.tap{ cursor:pointer; }
  .owner{ margin:0 0 10px; font-size:12px; color:var(--sub); background:#fff;
          border:1px dashed var(--line); border-radius:10px; padding:8px 11px; }

  .foot{ margin-top:22px; font-size:11.5px; color:var(--sub); line-height:1.8; }
  .rel{ display:block; width:100%; margin-top:16px; padding:13px; font-family:inherit;
        font-size:14px; font-weight:700; color:#fff; background:var(--green);
        border:0; border-radius:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 アサイン管理</h1>
  <div class="lead" id="lead">読み込み中…</div>
  <div id="msg" class="msg"></div>

  <div class="tabs" id="tabs" style="display:none">
    <button id="tb-jobs"  class="on" onclick="tab('jobs')">📋 予定</button>
    <button id="tb-staff"        onclick="tab('staff')">👥 スタッフ</button>
  </div>

  <div class="filt" id="filt" style="display:none">
    <div class="r">
      <label>期間</label>
      <select id="f-days" onchange="reload()">
        <option value="7">1週間</option>
        <option value="14" selected>2週間</option>
        <option value="30">1か月</option>
      </select>
    </div>
    <div class="r">
      <label>物件</label>
      <select id="f-prop" onchange="draw()"><option value="">すべて</option></select>
    </div>
    <div class="r">
      <label class="chk"><input type="checkbox" id="f-bad" onchange="draw()">
        <span>決まっていない日だけ</span></label>
    </div>
  </div>

  <div id="body"><div class="center">読み込み中…</div></div>
</div>

<!-- ★v7.45 担当を決めるシート（段2） -->
<div class="ovl" id="ovl" onclick="if(event.target===this)closeEdit()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="wrap" style="padding-top:0">
  <button class="rel" id="rel" onclick="reload()" style="display:none">🔄 最新の状態にする</button>
  <div class="foot" id="foot"></div>
</div>

<script>
// ============================================================
// アサイン管理ダッシュボード（段1・表示のみ）
//
// ⚠️ この画面は【1セルも書きません】。見るだけです。登録・変更は段2以降。
//
// ★LIFF_ID は LINE Developers でアプリを作ってから差し替えます。
//   それまでは PC のブラウザで
//     assign.html?debug=<管理者のLINE userId>
//   と開けば、LIFF なしで中身を確認できます。
// ============================================================
const LIFF_ID = '2010751229-89yq6FEa';   // ★v7.42 アサイン管理（管理者のみ）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx_ubqKRZeQfNL7qIiElNzE0iTjvq7487Hzx3xor8P4M-u55hF7-EL0n8G-5nYofc_sXg/exec';

const $ = function(id){ return document.getElementById(id); };
// ★v7.42 日付の書き方を1か所に集約。予定=8/29(土) / シフト=8/29（0詰めなし）
// ★v7.43 画面に版数を出す。LINEはキャッシュが強く「どのファイルを見ているか」が分からなくなる。
//   ここが古いままなら、エンドポイントURLの ?v= を上げてください。
const APP_VER = 'v7.50';
const fmtMD = function(d){ if(!d) return ''; const p=String(d).split('-'); return (+p[1])+'/'+(+p[2]); };
const esc = function(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

let me = null;
let DATA = null;
let TAB = 'jobs';

function jsonp(url){
  return new Promise(function(resolve,reject){
    const cb = 'ab_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const s = document.createElement('script');
    const t = setTimeout(function(){ cleanup(); reject(new Error('時間内に応答がありませんでした')); }, 25000);
    function cleanup(){
      clearTimeout(t);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = function(d){ cleanup(); resolve(d); };
    s.onerror = function(){ cleanup(); reject(new Error('通信に失敗しました')); };
    s.src = url + '&callback=' + cb;
    document.body.appendChild(s);
  });
}

function showErr(text){
  $('msg').className='msg err'; $('msg').textContent=text;
  $('body').innerHTML=''; $('rel').style.display='block';
  $('tabs').style.display='none'; $('filt').style.display='none';
}

function tab(name){
  TAB = name;
  $('tb-jobs').className  = (name==='jobs')  ? 'on' : '';
  $('tb-staff').className = (name==='staff') ? 'on' : '';
  $('filt').style.display = (name==='jobs') ? 'block' : 'none';
  draw();
}

// ---- 予定 ----
// ★v7.36 未アサインの行に「その日シフトを出している人」を出す。
//   誰に連絡すればいいかが、この画面だけで分かるようにするため。
function candHtml(j){
  const c = j.cands || [];
  if(!c.length && j.staff && j.staff.length) return '';   // 足りている行には出さない
  if(!c.length){
    if(j.staff && j.staff.length) return '';
    return '<div class="cand none">この日シフトを出している対応可能スタッフはいません</div>';
  }
  // ★v7.38 移動手段は出さない。区分は【その清掃日】時点のものがサーバーから来る
  const chips = c.map(function(x){
    const tr = (x.kind==='研修') ? '<i>研修</i>' : '';
    return '<span class="chip">'+esc(x.disp)+tr+'</span>';
  }).join('');
  return '<div class="cand">📣 この日シフト提出 '+c.length+'名<div class="chips">'+chips+'</div></div>';
}

// ★v7.42 チェック対応日が清掃日と別の日のとき、その日の側に出す専用カード。
//   集計（未アサイン・人数不足）には入れない。親の清掃の行で数えているため。
function checkHtml(j){
  const md = fmtMD;
  const none = !j.staff || !j.staff.length;
  return '<div class="job chk'+(j.isPast?' past':'')+'">'
    +   '<div class="top">'
    +     '<span class="d">'+esc(fmtMD(j.ymd))+'('+esc(j.wd)+')'
    +        (j.isToday ? '<span class="today">本日</span>' : '')+'</span>'
    +     '<span class="p">'+esc(j.prop)+' <span class="badge ck">チェック</span></span>'
    +   '</div>'
    +   '<div class="rows">'
    +     '<span class="k">時間</span><span class="v">'+esc(j.chkTime||'--:--')+'</span>'
    +     '<span class="k">担当</span><span class="v'+(none?' none':'')+'">'
    +        (none ? '未定' : esc(j.staff.join('・')))+'</span>'
    +     '<span class="k">清掃</span><span class="v"><span class="t">'
    +        esc(md(j.cleanDate))+'　'+esc((j.cleanStaff||[]).join('・')||'未アサイン')+'</span></span>'
    +   '</div>'
    + '</div>';
}

function jobHtml(j){
  if(j.kind === 'check') return checkHtml(j);
  const noStaff = !j.staff || !j.staff.length;
  const editable = !j.isPast;                       // ★v7.45 過去は編集できない（F-8）
  const cls = 'job' + (noStaff ? ' bad' : '') + (j.isPast ? ' past' : '') + (editable ? ' tap' : '');
  const time = (j.start || '--:--') + '〜' + (j.end || '--:--');
  // ★v7.37 同日INは一番の事故要因（次のゲストが来るまでに終わらせないといけない）
  const isSameDay = !!(j.sameDay && j.sameDay!=='' && j.sameDay!=='×' && j.sameDay!=='なし');
  const sd = isSameDay ? '<span class="tag sd">⚠️ 同日IN '+esc(j.inT||'')+'</span>' : '';

  // ★v7.37 滞在期間 / 宿泊人数 / 次回IN / 次回人数 / 募集人数
  const md = fmtMD;
  const stayTxt = (j.inD && j.outD)
    ? md(j.inD)+'〜'+md(j.outD)+(j.nights ? ' <b>'+j.nights+'泊</b>' : '')
    : '<span class="t">—</span>';
  const guestTxt = j.guests ? '<b>'+esc(j.guests)+'名</b>' : '<span class="t">未入力</span>';

  let nextTxt;
  if(j.nextIn){
    nextTxt = (isSameDay ? '⚠️ ' : '') + md(j.nextIn)
            + (j.inT ? ' '+esc(j.inT) : '')
            + (j.nextGuests ? ' <b>'+esc(j.nextGuests)+'名</b>' : ' <span class="t">人数未入力</span>');
  }else{
    nextTxt = '<span class="t">次の予約なし</span>';
  }

  // 募集人数：足りていなければ赤。決まっていない件数がひと目で分かるように
  const nowN  = (j.staff||[]).length;
  const needN = parseInt(j.need, 10);
  let needTxt = '<span class="t">—</span>';
  if(needN > 0){
    const short = (nowN < needN);
    needTxt = '<b'+(short?' style="color:#c62828"':'')+'>'+nowN+' / '+needN+'名</b>'
            + (short ? ' <span style="color:#c62828;font-weight:700">あと'+(needN-nowN)+'名</span>' : '');
  }
  const chkDay = (j.chkDate && j.chkDate !== j.ymd) ? '（'+esc(fmtMD(j.chkDate))+'）' : '';
  // ★v7.35 チェックが要るのは【外注】と【研修中】が入っているジョブだけ。
  //   それ以外は空欄でも「—」と出す（全部に「未定」と出ると本当に見るべき所が埋もれる）
  const hasChk = !!(j.chk && j.chk.length);
  let chkCell;
  if(hasChk){
    chkCell = '<span class="v">'+esc(j.chk.join('・'))+chkDay
            + (j.chkTime ? ' <span class="t">'+esc(j.chkTime)+'</span>' : '')+'</span>';
  }else if(j.needChk){
    chkCell = '<span class="v none">未定 <span class="t">（'+esc(j.chkWhy||'')+'が入っています）</span></span>';
  }else{
    chkCell = '<span class="v"><span class="t">—</span></span>';
  }
  return '<div class="'+cls+'"'
    +   (editable ? ' onclick="openEdit(\''+esc(j.jobKey)+'\')"' : '')+'>'
    +   '<div class="top">'
    +     '<span class="d">'+esc(fmtMD(j.ymd))+'('+esc(j.wd)+')'
    +        (j.isToday ? '<span class="today">本日</span>' : '')+'</span>'
    +     '<span class="p">'+esc(j.prop)+'</span>'
    +   '</div>'
    +   '<div class="rows">'
    +     '<span class="k">時間</span><span class="v">'+esc(time)
    +        (j.std ? ' <span class="t">/ 標準'+esc(j.std)+'</span>' : '')+sd+'</span>'
    +     '<span class="k">滞在</span><span class="v">'+stayTxt+' <span class="t">/</span> '+guestTxt+'</span>'
    +     '<span class="k">次回IN</span><span class="v'+(isSameDay?' none':'')+'">'+nextTxt+'</span>'
    +     '<span class="k">清掃</span><span class="v'+(noStaff?' none':'')+'">'
    +        (noStaff ? '未アサイン' : esc(j.staff.join('・')))+'</span>'
    +     '<span class="k">募集人数</span><span class="v">'+needTxt+'</span>'
    +     '<span class="k">チェック</span>'+chkCell
    +     '<span class="k">状態</span><span class="v"><span class="t">'
    +        esc(j.assign||'—')+'</span></span>'
    +   '</div>'
    +   (j.memo ? '<div class="memo">'+esc(j.memo)+'</div>' : '')
    +   candHtml(j)
    + '</div>';
}
// ★v7.37 募集人数に足りていない＝まだ手配が終わっていない
function isShort(j){
  const n = parseInt(j.need, 10);
  return (n > 0 && (j.staff||[]).length > 0 && (j.staff||[]).length < n);
}
function groupHtml(title, cls, jobs){
  if(!jobs.length) return '';
  return '<div class="grp '+cls+'">'+title+'　'+jobs.length+'件</div>'+jobs.map(jobHtml).join('');
}


// ============================================================
// ★v7.50【案E】1日ぶんを「スタッフ別ルート」で見る
//   軸を物件ではなく人にする。1人＝1レーン。上から順に回る。
//   現場と現場のあいだに移動時間を出すので、無理な組み方に気づける。
//   未アサインは上の赤い箱に置き、タップして担当を決める。
// ============================================================
function dayList(){
  const seen = {}, out = [];
  (DATA.areas||[]).forEach(function(a){
    a.jobs.forEach(function(j){ if(!seen[j.ymd]){ seen[j.ymd]=1; out.push(j.ymd); } });
  });
  return out.sort();
}
function jobsOf(ymd){
  const out = [];
  (DATA.areas||[]).forEach(function(a){
    a.jobs.forEach(function(j){ if(j.ymd===ymd) out.push(Object.assign({area:a.id, areaLabel:a.label}, j)); });
  });
  return out;
}
function staffOf(name){
  return (DATA.staff||[]).find(function(s){ return s.disp===name || s.name===name; });
}
function travelMin(pidA, pidB, move){
  if(!pidA || !pidB || pidA===pidB) return null;
  const md = ttMode(move);
  const v = (DATA.travel||{})[pidA+'>'+pidB+'|'+md];
  return (v===undefined) ? null : v;
}
function ttMode(move){
  const s = String(move||'');
  const t = s.replace(/自転車/g,'§').replace(/電車/g,'¶');
  if(/車|自動車|マイカー|バイク|原付|単車/.test(t)) return 'driving';
  if(/¶|バス|公共|地下鉄|モノレール/.test(t))       return 'transit';
  if(/§|チャリ|ロード/.test(t))                     return 'bicycling';
  if(/徒歩|歩き/.test(s))                           return 'walking';
  return 'driving';
}
function moveIcon(move){
  const md = ttMode(move);
  return md==='driving' ? '🚗' : md==='transit' ? '🚃' : md==='bicycling' ? '🚲' : '🚶';
}
function shortOf(j){
  const n = parseInt(j.need,10);
  return (n>0) ? Math.max(0, n - (j.staff||[]).length) : 0;
}

function drawJobs(){
  let days = dayList();
  // ★v7.50「決まっていない日だけ」＝未アサイン・人数不足・チェック未定がある日に絞る
  if($('f-bad').checked){
    const ng = days.filter(function(d){
      return jobsOf(d).some(function(j){
        return j.kind!=='check' && (!j.staff.length || shortOf(j)>0 || j.needChk); });
    });
    if(ng.length) days = ng;
  }
  if(!days.length){ $('body').innerHTML='<div class="center">この期間の予定はありません。</div>'; return; }
  if(!DAY || days.indexOf(DAY)<0) DAY = (days.indexOf(DATA.today)>=0) ? DATA.today : days[0];

  // ---- 日付ストリップ ----
  let strip = '<div class="strip">';
  days.forEach(function(d){
    const js = jobsOf(d).filter(function(j){ return j.kind!=='check'; });
    const bad = js.filter(function(j){ return !j.staff.length || shortOf(j)>0; }).length;
    const wrn = js.filter(function(j){ return j.needChk; }).length;
    const w = new Date(d+'T00:00:00').getDay();
    strip += '<div class="dd'+(d===DAY?' on':'')+(w===0?' sun':'')+(w===6?' sat':'')+'"'
          +  ' onclick="pickDay(\''+d+'\')">'
          +  '<div class="w">'+WD[w]+'</div><div class="n">'+(+d.split('-')[2])+'</div>'
          +  '<div class="m">'+(+d.split('-')[1])+'月</div>'
          +  '<div class="pips">'+(bad?'<i class="pip r"></i>':'')+(wrn?'<i class="pip y"></i>':'')+'</div>'
          +  '</div>';
  });
  strip += '</div>';

  const js = jobsOf(DAY);
  const clean = js.filter(function(j){ return j.kind!=='check'; });
  const checks = js.filter(function(j){ return j.kind==='check'; });
  const fp = $('f-prop').value;
  const pass = function(j){ return !fp || j.pid===fp; };

  // ---- 未アサインの箱 ----
  const needStaff = clean.filter(function(j){ return pass(j) && (!j.staff.length || shortOf(j)>0); });
  const needChk   = clean.filter(function(j){ return pass(j) && j.needChk; });
  let tray = '';
  if(needStaff.length || needChk.length){
    tray = '<div class="tray">';
    if(needStaff.length){
      tray += '<div class="th">🔴 未アサイン '+needStaff.length+'件</div>'
           +  needStaff.map(function(j){
                const rest = shortOf(j) || (parseInt(j.need,10)>0 ? 0 : 1);
                return '<div class="tcard" onclick="openEdit(\''+esc(j.jobKey)+'\')">'
                     + '<span class="p">'+esc(j.prop)
                     +   '<small>'+esc(j.start||'--:--')+'〜'+esc(j.end||'--:--')
                     +   (j.std?' ／ 標準'+esc(j.std):'')
                     +   (j.nextIn===j.ymd?' ／ 次回IN '+esc(j.inT||'')+' ⚠️':'')+'</small></span>'
                     + '<span class="n">あと'+rest+'名<em>'+(j.staff.length)+'/'+(j.need||'—')+'</em></span></div>';
              }).join('');
    }
    if(needChk.length){
      tray += '<div class="th y">🟡 チェック未定 '+needChk.length+'件</div>'
           +  needChk.map(function(j){
                return '<div class="tcard y" onclick="openEdit(\''+esc(j.jobKey)+'\')">'
                     + '<span class="p">'+esc(j.prop)
                     +   '<small>清掃 '+esc(j.staff.join('・'))+'（'+esc(j.chkWhy||'')+'）</small></span>'
                     + '<span class="n">チェック<em>要 1名</em></span></div>';
              }).join('');
    }
    tray += '</div>';
  }

  // ---- 人ごとに束ねる ----
  const lanes = {};   // name → [stop]
  const push = function(nm, stop){ (lanes[nm] = lanes[nm] || []).push(stop); };
  clean.filter(pass).forEach(function(j){
    (j.staff||[]).forEach(function(nm){ push(nm, {j:j, kind:'清掃', t:j.start||'', end:j.end||''}); });
  });
  checks.concat(clean.filter(function(j){ return pass(j) && j.chk && j.chk.length && (!j.chkDate || j.chkDate===DAY); }))
    .forEach(function(j){
      (j.chk||[]).forEach(function(nm){ push(nm, {j:j, kind:'チェック', t:j.chkTime||'', end:''}); });
    });

  const OUT = ['外注','オーナー'];
  const names = Object.keys(lanes).sort(function(a,b){
    const ao = OUT.indexOf(a)>=0?1:0, bo = OUT.indexOf(b)>=0?1:0;
    if(ao!==bo) return ao-bo;
    const sa = (lanes[a][0]||{}).t || '99:99', sb = (lanes[b][0]||{}).t || '99:99';
    return sa < sb ? -1 : 1;
  });

  let body = '';
  names.forEach(function(nm){
    const s = staffOf(nm);
    const isOut = OUT.indexOf(nm)>=0;
    const stops = lanes[nm].sort(function(x,y){ return (x.t||'99:99') < (y.t||'99:99') ? -1 : 1; });
    const k = s ? kindAt(s, DAY) : '';
    const kb = isOut ? '<span class="badge ot">重なりOK</span>'
             : k==='研修' ? '<span class="badge tr">研修中</span>'
             : k==='独り立ち' ? '<span class="badge so">独り立ち</span>'
             : k==='稼働前' ? '<span class="badge ng">稼働前</span>' : '';
    let inner = '';
    stops.forEach(function(st, i){
      if(i>0 && !isOut){
        const prev = stops[i-1];
        const mn = travelMin(prev.j.pid, st.j.pid, s ? s.move : '');
        inner += '<div class="hop"><span class="tm"></span><span class="ln">'
              +  (prev.j.pid===st.j.pid ? '同じ物件' :
                  (moveIcon(s?s.move:'')+' 移動 '+(mn==null?'？':mn)+'分'))+'</span></div>';
      }
      const isChk = st.kind==='チェック';
      const cls = 'stop'+(isChk?' b':(st.j.needChk?' y':' g'));
      inner += '<div class="'+cls+'" onclick="openEdit(\''+esc(st.j.jobKey)+'\')">'
            +   '<span class="tm">'+esc(st.t||'--:--')+(st.end?'<small>〜'+esc(st.end)+'</small>':'')+'</span>'
            +   '<div class="bx"><div class="p">'+esc(st.j.prop)
            +     (isChk?' <span class="badge ck">チェック</span>':'')+'</div>'
            +     '<div class="d">'
            +       (isChk ? ('清掃 '+esc((st.j.cleanStaff||st.j.staff||[]).join('・')))
                           : ((st.j.nights?st.j.nights+'泊 ':'')+(st.j.guests?st.j.guests+'名 ':'')
                              +(st.j.std?'／ 標準'+esc(st.j.std):'')
                              +(st.j.nextIn?' ／ 次回IN <b>'+esc(fmtMD(st.j.nextIn))+' '+esc(st.j.inT||'')+'</b>'
                                 +(st.j.nextIn===st.j.ymd?' ⚠️':''):'')))
            +     '</div></div></div>';
    });
    body += '<div class="lane'+(isOut?' out':'')+'">'
         +  '<div class="hd"><span class="nm">'+esc(nm)+'</span>'+kb
         +    (s&&s.move?'<span class="mv">'+esc(s.move)+'</span>':'')
         +    '<span class="sum">'+stops.length+'件</span></div>'
         +  '<div class="body">'+inner+'</div></div>';
  });

  // ---- シフトは出ているが、まだ入っていない人 ----
  const free = (DATA.staff||[]).filter(function(s){
    if(lanes[s.disp]) return false;
    const mk = (s.shift||{})[DAY];
    return mk && mk!=='×';
  }).sort(function(a,b){ return a.disp<b.disp?-1:1; });
  let freeHtml = '';
  if(free.length){
    freeHtml = '<div class="sec2">シフトは出ているが、まだ入っていない人 '+free.length+'名</div>'
      + '<div class="freerow">'+free.map(function(s){
          const k = kindAt(s, DAY);
          return '<span class="fchip">'+esc(s.disp)
               + (k==='研修'?'<i>研修</i>':'')
               + (s.move?'<u>'+esc(s.move)+'</u>':'')+'</span>'; }).join('')+'</div>';
  }

  const nBad = needStaff.length, nChk = needChk.length;
  const head = '<div class="dayhd">'+esc(fmtMD(DAY))+'('+esc(WD[new Date(DAY+'T00:00:00').getDay()])+')'
    + (DAY===DATA.today?'<span class="today">本日</span>':'')
    + '<small>'+clean.length+'件'
    + (nBad?'　🔴'+nBad:'')+(nChk?'　🟡'+nChk:'')+'</small></div>';

  $('body').innerHTML = strip + head + tray
    + (body || '<div class="center">この日はまだ誰も入っていません。</div>') + freeHtml;
}


// ★v7.36 提出シフトは「何日ぶん出したか」ではなく【いつ出しているか】を出す。
//   件数だけでは、その日に頼めるかどうか分からない。
const WD = ['日','月','火','水','木','金','土'];
function shiftHtml(shift, nDays){
  const days = Object.keys(shift||{}).sort();
  if(!days.length) return '<span style="color:#a06a00;font-weight:700">未提出</span>';
  // ★v7.38 サーバー側で ○ / × に正規化済み。生値（true など）は流れてこない
  const ok = days.filter(function(d){ return shift[d] !== '×'; });
  const chips = days.map(function(d){
    const w   = new Date(d+'T00:00:00').getDay();
    const cls = (w===0) ? ' class="sun"' : (w===6 ? ' class="sat"' : '');
    const bad = (shift[d] === '×');
    const lbl = fmtMD(d);          // ★v7.42 曜日なし・0詰めなし
    return '<span'+(bad?' style="color:#aaa;text-decoration:line-through"':cls)+'>'+esc(lbl)+'</span>';
  }).join('');
  return '<span style="color:#666;font-size:12px">'+ok.length+'日 / '+nDays+'日</span>'
       + '<div class="days">'+chips+'</div>';
}

// ---- スタッフ ----
function drawStaff(){
  const st = DATA.staff || [];
  if(!st.length){ $('body').innerHTML='<div class="center">対象のスタッフがいません。</div>'; return; }
  const propName = {};
  (DATA.props||[]).forEach(function(p){ propName[p.pid]=p.name; });

  const nDays = (function(){
    const a=new Date(DATA.from+'T00:00:00'), b=new Date(DATA.to+'T00:00:00');
    return Math.round((b-a)/86400000)+1;
  })();

  // ★v7.36 稼働していない人はサーバー側で外してあるので、ここは全員が稼働中
  let h = '<div class="sum">'
    + '<div><b>'+st.length+'</b><span>稼働中</span></div>'
    + '<div class="warn"><b>'+st.filter(function(x){return x.kind==='研修';}).length+'</b><span>研修中</span></div>'
    + '<div class="bad"><b>'+st.filter(function(x){return !x.move;}).length+'</b><span>移動手段 未設定</span></div>'
    + '<div class="warn"><b>'+st.filter(function(x){return x.kind==='研修'&&(x.done||0)>=3;}).length+'</b><span>独り立ち判断</span></div>'
    + '</div>';

  const sortFn = function(a,b){
    if(a.active !== b.active) return a.active ? -1 : 1;
    const ar = (a.kind==='研修') ? 0 : 1, br = (b.kind==='研修') ? 0 : 1;
    if(ar !== br) return ar - br;                       // 研修中を先頭に（判断が要る人）
    if(ar===0) return (b.done||0) - (a.done||0);        // 研修中は実績の多い順
    return a.disp < b.disp ? -1 : 1;
  };

  // ★v7.35 エリアごとに分ける。両エリア担当の人は【どちらにも】出す。
  //   （近藤さんのように湘南と横須賀を兼ねる人がいるため、片方に寄せると探せなくなる）
  const labels = DATA.areaLabels || {};
  const areaIds = Object.keys(labels);
  const groups = areaIds.length ? areaIds.map(function(aid){
    return { id:aid, label: labels[aid]||aid,
             list: st.filter(function(s){ return (s.areas||[]).indexOf(aid) >= 0; }).sort(sortFn) };
  }).filter(function(g){ return g.list.length; }) : [{ id:'', label:'', list: st.slice().sort(sortFn) }];

  const cardHtml = function(s){
    const shiftN = Object.keys(s.shift||{}).length;
    const doneN = s.done || 0;
    // ★行頭の + で三項演算子を繋ぐと構文エラーになる。先に組み立てる
    let trainRow = '';
    if(s.kind === '研修'){
      const col = (doneN >= 3) ? 'color:#2e7d32' : 'color:#a06a00';
      trainRow = '<span class="k">実績</span><span>'
        + '<b style="font-size:15px;'+col+'">'+doneN+'回</b>'
        + (s.doneCheck ? ' <span style="color:#666;font-size:12px">＋チェック'+s.doneCheck+'回</span>' : '')
        + (s.lastDone  ? ' <span style="color:#666;font-size:12px">最終 '+esc(fmtMD(s.lastDone))+'</span>' : '')
        + (doneN >= 3  ? ' <span class="badge so">独り立ち判断</span>' : '')
        + '</span>';
    }
    const kb = s.kind==='研修'     ? '<span class="badge tr">研修中</span>'
             : s.kind==='独り立ち' ? '<span class="badge so">独り立ち</span>'
             : s.kind==='稼働前'   ? '<span class="badge ng">稼働前</span>'
             : '<span class="badge ng">区分未設定</span>';

    // ★v7.35 研修中なのに「独り立ち日」が未来＝まだ研修、という状態を見えるようにする。
    //   日付を入れたのに反映されていないように見えるのは、たいていこれ。
    let soloRow = '';
    if(s.kind==='研修' && s.soloFrom){
      soloRow = '<span class="k">独り立ち予定</span><span>'+esc(s.soloFrom)
              + ' <span class="t">（この日から時給が変わります）</span></span>';
    }else if(s.kind==='研修'){
      soloRow = '<span class="k">独り立ち予定</span>'
              + '<span><span style="color:#a06a00;font-weight:700">未設定</span>'
              + ' <span class="t">スタッフマスタ P列「独り立ち日」</span></span>';
    }

    // ★v7.35 稼働回数は勤怠ログから毎回その場で数えた最新値
    const workRow = '<span class="k">稼働回数</span><span>'
      + '<b>'+(s.mDone||0)+'回</b> <span class="t">今月</span>'
      + ' <span style="color:#666;font-size:12px">/ 累計 '+(s.tDone||0)+'回</span>'
      + '</span>';

    const props = s.propsAll ? 'エリア内すべて'
                : (s.props.length
                    ? s.props.map(function(p){ return esc(propName[p]||p); }).join('・')
                    : '<span style="color:#c62828;font-weight:700">なし</span>');
    return '<div class="st'+(s.active?'':' off')+'">'
      +   '<div class="n">'+esc(s.disp)+kb+(s.active?'':'<span class="badge ng">稼働停止</span>')+'</div>'
      +   '<div class="rows">'
      +     trainRow
      +     soloRow
      +     workRow
      +     '<span class="k">対応可物件</span><span>'+props+'</span>'
      +     '<span class="k">移動手段</span><span>'
      +        (s.move ? esc(s.move) : '<span style="color:#c62828;font-weight:700">未設定</span>')
      +     '</span>'
      +     '<span class="k">提出シフト</span><span>'+shiftHtml(s.shift, nDays)+'</span>'
      +   '</div>'
      + '</div>';
  };

  groups.forEach(function(g){
    if(g.label) h += '<div class="area">【'+esc(g.label)+'】<span class="cnt">'+g.list.length+'名</span></div>';
    h += g.list.map(cardHtml).join('');
  });
  $('body').innerHTML = h;
}


// ============================================================
// ★v7.45【段2】担当を決めて保存する
//   できること: 清掃担当 / 募集人数 / チェック担当 だけ。
//   ⚠️ 時刻・清掃日は触りません（段3・段4）。
//   保存の可否・整合はすべてサーバー側（AssignApply.gs）が判定します。
//   画面は「選ばせて送るだけ」。ここで判定を二重に持つと必ずズレます。
// ============================================================
const OUTSIDE = ['外注','オーナー'];
let ED = null;      // 編集中の状態
let DAY = '';       // ★v7.50 いま見ている日
function pickDay(d){ DAY = d; draw(); window.scrollTo(0,0); }

function findJob(jobKey){
  let hit = null;
  (DATA.areas||[]).forEach(function(a){
    a.jobs.forEach(function(j){ if(j.kind!=='check' && j.jobKey===jobKey && !hit) hit = j; });
  });
  return hit;
}

// その日その物件に出せる人（シフト提出者を先に、未提出も選べる）
function pickable(j){
  const okProp = function(s){ return s.propsAll || (s.props||[]).indexOf(j.pid) >= 0; };
  const shifted = [], others = [];
  (DATA.staff||[]).forEach(function(s){
    if(!okProp(s)) return;
    const mk = (s.shift||{})[j.ymd];
    (mk && mk !== '×' ? shifted : others).push(s);
  });
  const by = function(a,b){ return a.disp < b.disp ? -1 : 1; };
  return { shifted: shifted.sort(by), others: others.sort(by) };
}

function kindAt(s, ymd){
  const tf = s.trainFrom||'', sf = s.soloFrom||'';
  if(!tf && !sf) return '';
  if(tf && ymd < tf) return '稼働前';
  return (sf && ymd >= sf) ? '独り立ち' : '研修';
}

function openEdit(jobKey){
  const j = findJob(jobKey);
  if(!j) return;
  ED = { j: j,
         staff: (j.staff||[]).slice(),
         chk:   (j.chk||[]).slice(),
         need:  String(j.need||''),
         busy:  false, err: '' };
  drawEdit();
  $('ovl').classList.add('on');
}
function closeEdit(){ $('ovl').classList.remove('on'); ED = null; }

function togStaff(n){ tog(ED.staff, n); drawEdit(); }
function togChk(n){   tog(ED.chk,   n); drawEdit(); }
function tog(arr, n){ const i = arr.indexOf(n); if(i>=0) arr.splice(i,1); else arr.push(n); }
function bumpNeed(d){
  let n = parseInt(ED.need,10); if(!isFinite(n)) n = 0;
  n += d; if(n < 0) n = 0; if(n > 9) n = 9;
  ED.need = n ? String(n) : '';
  drawEdit();
}

function pillHtml(label, on, fn, sub){
  return '<button class="pill'+(on?' on':'')+'" onclick="'+fn+'">'+esc(label)
       + (sub ? '<i>'+esc(sub)+'</i>' : '')+'</button>';
}

function drawEdit(){
  const j = ED.j, P = pickable(j);
  const isTrainee = function(s){ return kindAt(s, j.ymd) === '研修'; };
  const q = function(x){ return "'"+String(x).replace(/'/g,"\\'")+"'"; };

  const staffPills = function(list){
    return list.map(function(s){
      const k = kindAt(s, j.ymd);
      return pillHtml(s.disp, ED.staff.indexOf(s.disp)>=0, 'togStaff('+q(s.disp)+')',
                      k==='研修' ? '研修' : (k==='稼働前' ? '稼働前' : ''));
    }).join('');
  };
  // チェック担当は独り立ちのみ（研修中は見る側になれない）
  const chkList = P.shifted.concat(P.others).filter(function(s){ return !isTrainee(s); });

  const nowN = ED.staff.length;
  const needN = parseInt(ED.need,10);
  const hasSolo = ED.staff.some(function(n){
    if(OUTSIDE.indexOf(n) >= 0) return false;
    const s = (DATA.staff||[]).find(function(x){ return x.disp===n || x.name===n; });
    return s ? kindAt(s, j.ymd) !== '研修' && kindAt(s, j.ymd) !== '稼働前' : false;
  });
  const needChk = nowN > 0 && !hasSolo;
  const isOwner = ED.staff.indexOf('オーナー') >= 0;

  let info = '';
  if(isOwner){
    info = '<div class="box info">オーナー対応にすると、この予定は一覧から外れます。</div>';
  }else if(needChk){
    info = '<div class="box info">🟡 独り立ちのスタッフがいないため、チェックが必要です。</div>';
  }else if(nowN){
    info = '<div class="box ok">✅ チェックは不要です（独り立ちが入っています）。</div>';
  }

  $('sheet').innerHTML =
      '<div class="hd"><b>'+esc(j.prop)+'</b>'
    +   '<small>'+esc(fmtMD(j.ymd))+'('+esc(j.wd)+')　'+esc(j.start||'--:--')+'〜'+esc(j.end||'--:--')
    +   (j.std ? '　標準'+esc(j.std) : '')+'</small></div>'

    + '<div class="sec"><div class="lb">清掃担当　'
    +   '<span style="color:'+((needN>0&&nowN<needN)?'#c62828':'#666')+'">'+nowN+' / '+(needN>0?needN:'—')+'名</span></div>'
    +   (P.shifted.length
        ? '<div style="font-size:11px;color:#666;margin-bottom:5px">この日シフト提出</div>'
          +'<div class="pills">'+staffPills(P.shifted)+'</div>' : '')
    +   (P.others.length
        ? '<div style="font-size:11px;color:#666;margin:9px 0 5px">シフト未提出（それでも選べます）</div>'
          +'<div class="pills">'+staffPills(P.others)+'</div>' : '')
    +   '<div style="font-size:11px;color:#666;margin:9px 0 5px">人以外の枠</div>'
    +   '<div class="pills">'+OUTSIDE.map(function(n){
          return pillHtml(n, ED.staff.indexOf(n)>=0, 'togStaff('+q(n)+')'); }).join('')+'</div>'
    + '</div>'

    + '<div class="sec"><div class="lb">募集人数</div>'
    +   '<div class="stp"><button onclick="bumpNeed(-1)">−</button>'
    +     '<span class="v">'+(ED.need ? ED.need+'名' : '未設定')
    +       '<small>'+(needN>0 && nowN<needN ? 'あと'+(needN-nowN)+'名' : '　')+'</small></span>'
    +     '<button onclick="bumpNeed(1)">＋</button></div>'
    + '</div>'

    + '<div class="sec"><div class="lb">チェック担当'
    +   (j.chkDate && j.chkDate!==j.ymd ? '　<span style="color:#1565c0">'+esc(fmtMD(j.chkDate))+'</span>' : '')
    +   '</div>'
    +   '<div class="pills">'+chkList.map(function(s){
          return pillHtml(s.disp, ED.chk.indexOf(s.disp)>=0, 'togChk('+q(s.disp)+')'); }).join('')+'</div>'
    +   '<div style="font-size:11px;color:#666;margin-top:6px">研修中の方はチェック担当にできません</div>'
    + '</div>'

    + (info ? '<div class="sec">'+info+'</div>' : '')
    + (ED.err ? '<div class="sec"><div class="box ng">'+esc(ED.err)+'</div></div>' : '')

    + '<div class="bar"><button class="c" onclick="closeEdit()">やめる</button>'
    +   '<button class="s" id="ed-save" onclick="saveEdit()"'+(ED.busy?' disabled':'')+'>'
    +   (ED.busy ? '保存しています…' : 'この内容で保存')+'</button></div>';
}

// ★v7.45 オーナー対応の一覧。タップすれば担当を付け替えて一覧に戻せる
function showOwner(){
  const list = DATA.ownerJobs || [];
  if(!list.length) return;
  ED = null;
  $('sheet').innerHTML =
      '<div class="hd"><b>オーナー対応</b><small>'+list.length+'件。一覧には出していません</small></div>'
    + '<div class="sec"><div class="lb">担当を付け替えると一覧に戻ります</div>'
    +   '<div class="pills">'+list.map(function(o){
          const q = "openOwner('" + String(o.jobKey).replace(/'/g,"") + "')";
          return '<button class="pill" onclick="'+q+'">'
               + esc(fmtMD(o.ymd))+'　'+esc(o.prop)+'</button>'; }).join('')+'</div></div>'
    + '<div class="bar"><button class="c" onclick="closeEdit()">閉じる</button></div>';
  $('ovl').classList.add('on');
}
function openOwner(jobKey){
  const o = (DATA.ownerJobs||[]).find(function(x){ return x.jobKey===jobKey; });
  if(!o) return;
  ED = { j: { row:o.row, jobKey:o.jobKey, ver:o.ver, ymd:o.ymd, wd:'', prop:o.prop, pid:o.pid,
              start:'', end:'', std:'', staff:['オーナー'], chk:[], need:'' },
         staff:['オーナー'], chk:[], need:'', busy:false, err:'' };
  drawEdit();
}

function saveEdit(){
  if(!ED || ED.busy) return;
  ED.busy = true; ED.err = ''; drawEdit();
  const j = ED.j;
  const payload = { items: [{
    row: j.row, jobKey: j.jobKey, ver: (j.ver==null?'':String(j.ver)),
    staff: ED.staff, chk: ED.chk, need: ED.need }] };

  jsonp(GAS_URL+'?mode=ab_apply&userId='+encodeURIComponent(me.userId)
        +'&payload='+encodeURIComponent(JSON.stringify(payload)))
  .then(function(res){
    if(res && res.ok){
      closeEdit();
      $('msg').className = 'msg';
      $('msg').textContent = res.message || '保存しました。';
      reload();
      return;
    }
    let m = (res && res.message) || '保存できませんでした。';
    if(res && res.ng && res.ng.length){
      m += '\n\n' + res.ng.map(function(x){ return '・'+x.prop+'：'+x.why; }).join('\n');
    }
    if(res && res.why) m += '\n\n【原因】'+res.why;
    ED.busy = false; ED.err = m; drawEdit();
  })
  .catch(function(err){
    ED.busy = false;
    ED.err = '通信できませんでした。電波の良い場所でもう一度お試しください。\n\n（'+err.message+'）';
    drawEdit();
  });
}

function draw(){
  if(!DATA) return;
  if(TAB==='staff') drawStaff(); else drawJobs();
}

function render(d){
  DATA = d;
  $('msg').className='msg'; $('msg').textContent='';
  $('lead').textContent = d.name+' さん　'+fmtMD(d.from)+'〜'+fmtMD(d.to)+' の予定　'+APP_VER;
  $('tabs').style.display='flex';
  $('filt').style.display = (TAB==='jobs') ? 'block' : 'none';

  const keep = $('f-prop').value;
  let opt = '<option value="">すべて</option>';
  (d.props||[]).forEach(function(p){
    opt += '<option value="'+esc(p.pid)+'">'+esc(p.name)+'</option>';
  });
  $('f-prop').innerHTML = opt;
  if(keep) $('f-prop').value = keep;

  $('rel').style.display='block';
  $('foot').innerHTML =
      '予定や未アサインの箱をタップすると<b>担当・募集人数・チェック担当</b>を変えられます。<br>'
    + '清掃日と時刻はまだ変えられません（スプレッドシートか本部へ）。<br>'
    + '過去の予定は変更できません。移動時間は実測（Googleマップ）です。';
  draw();
}

async function reload(){ await load(); }

async function load(){
  $('body').innerHTML='<div class="center">読み込み中…</div>';
  try{
    const days = $('f-days').value || '14';
    const res = await jsonp(GAS_URL+'?mode=ab_board&days='+encodeURIComponent(days)
                 +'&userId='+encodeURIComponent(me.userId));
    if(!res || !res.ok){
      // ★v7.34 なぜ開けないのかまで出す。「権限がありません」だけだと原因に辿り着けない
      let msg = (res && res.message) || '読み込めませんでした。';
      if(res && res.why) msg += '\n\n【原因】' + res.why;
      showErr(msg); return;
    }
    render(res);
  }catch(err){
    showErr('読み込みに失敗しました。\n電波の良い場所でもう一度お試しください。\n\n（'+err.message+'）');
  }
}

(async function(){
  // ★v7.34 ?debug=<Uxxxx> のように山カッコごと貼られる事故が起きたので、掃除してから使う
  const dbg = (new URLSearchParams(location.search).get('debug') || '')
                .replace(/[​-‍﻿]/g,'')
                .replace(/[\s　]+/g,'')
                .replace(/^[<＜"'“”]+/,'')
                .replace(/[>＞"'“”]+$/,'')
                .trim();
  if(dbg){
    me = { userId: dbg, name: '(debug)' };
    load();
    return;
  }
  if(!LIFF_ID){
    // ★v7.43 ここに来たら、たいてい【古いファイルをキャッシュから読んでいる】。
    //   LIFF_ID は v7.42 で設定済みなので、未設定＝古い版を見ている、と考えてよい。
    showErr('古い画面を読み込んでいます（'+APP_VER+' より前）。\n\n'
          + 'LINEのアプリ内ブラウザがキャッシュを持っています。\n'
          + 'LINE Developers のエンドポイントURLの末尾 ?v= の数字を上げてください。\n\n'
          + 'PCの場合は Cmd+Shift+R で読み直してください。');
    return;
  }
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }
    const prof = await liff.getProfile();
    me = { userId: prof.userId, name: prof.displayName };
    load();
  }catch(e){
    showErr('LINEの情報を取得できませんでした。\nLINEアプリから開き直してください。\n\n（'+e.message+'）');
  }
})();
</script>
