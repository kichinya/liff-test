    +   '<div class="stp"><button onclick="bumpStart(-1)">−</button>'
    +     '<span class="v">'+esc(ED.start||'--:--')+'〜'+esc(ED.end||'--:--')
    +       '<small>開始を30分ずつ動かす'+(j.outT?'／OUT '+esc(j.outT)+' 以降':'')+'</small></span>'
    +     '<button onclick="bumpStart(1)">＋</button></div>'
    +   '<div class="lb" style="margin:11px 0 6px">所要時間</div>'
    +   '<div class="stp"><button onclick="bumpSpan(-1)">−</button>'
    +     '<span class="v">'+(spanNow!=null ? Math.floor(spanNow/60)+'h'+('0'+(spanNow%60)).slice(-2) : '—')
    +       '<small>30分ずつ</small></span>'
    +     '<button onclick="bumpSpan(1)">＋</button></div>'
    +   (stdN ? '<div class="pills" style="margin-top:8px">'
        + pillHtml('標準どおり', spanNow===stdN, 'setSpan('+stdN+')')
        + pillHtml('−30分', spanNow===stdN-30, 'setSpan('+(stdN-30)+')')
        + pillHtml('−1時間', spanNow===stdN-60, 'setSpan('+(stdN-60)+')')
        + pillHtml('＋30分', spanNow===stdN+30, 'setSpan('+(stdN+30)+')')
        + '</div>' : '')
    +   (cutN>0 ? '<div class="lb" style="margin:11px 0 6px">短縮した理由（記録に残します）</div>'
        + '<div class="pills">'
        + ['2名で対応','ベテラン','連泊なし','少人数の宿泊','その他'].map(function(m){
            return pillHtml(m, ED.memo===m, 'setMemo('+q(m)+')'); }).join('')
        + '</div>' : '')
    + '</div>'

    // ★v7.55 段4 清掃日
    + '<div class="sec"><div class="lb">清掃日'
    +   (j.nextIn ? '　<span style="color:#666">次回IN '+esc(fmtMD(j.nextIn))+' '+esc(j.inT||'')+' まで</span>' : '')
    +   '</div><div class="pills">'
    +   dateRange(j).map(function(d){
          const w = new Date(d+'T00:00:00').getDay();
          const hn = holName(d);                                  // ★v7.78 祝日
          return pillHtml(fmtMD(d)+'('+WD[w]+')', ED.date===d, 'setDate('+q(d)+')',
                          hn || '', isRedDay(d) ? 'hol' : ''); }).join('')
    +   '</div>'
    +   (j.outD ? '<div style="font-size:11px;color:#666;margin-top:6px">'
        + 'チェックアウト '+esc(fmtMD(j.outD))+' より前、次回INより後には動かせません</div>' : '')
    + '</div>'
    + '<div class="sec" style="padding-top:0"><button class="pill" onclick="toggleClean()">'
    +   '▲ 清掃の欄を閉じる</button></div>'
      ) : (
        '<div class="sec"><div class="lb">この清掃（変更しません）</div>'
      + '<div style="font-size:13px;color:#333;font-weight:700">'
      +   esc(fmtMD(ED.date))+'　'+esc(ED.start||'--:--')+'〜'+esc(ED.end||'--:--')+'</div>'
      + '<div style="font-size:12px;color:var(--sub);margin-top:3px">清掃担当　'
      +   esc((ED.staff.length ? staffLabelOf(ED.staff, j) : '（未アサイン）'))+'</div>'
      + '<div class="pills" style="margin-top:8px">'
      +   '<button class="pill" onclick="toggleClean()">▼ 清掃の担当・時間も変更する</button></div>'
      + '</div>'
      ))

    // ★v7.57 チェックは【必要なときだけ】出す。
    //   独り立ちが入っていれば不要なので、欄そのものを出さない（迷わせない）。
    //   ただし既にチェック担当が入っている場合は、外せるように出す。
    + (showChk
      ? '<div class="sec"><div class="lb">チェック担当'
        + (needChk ? '　<span style="color:#a06a00">必要（'+esc(chkWhyNow)+'）</span>'
                   : '　<span style="color:#666">不要ですが設定されています</span>')+'</div>'
        + '<div class="pills">'+(chkList.length
            ? chkList.map(function(s){
                return pillHtml(s.disp, ED.chk.indexOf(s.disp)>=0, 'togChk('+q(s.disp)+')'); }).join('')
            : '<span style="font-size:12px;color:#c62828;font-weight:700">'
              + 'チェックをお願いできる方がいません。外注かオーナーでの対応をご検討ください。</span>')+'</div>'
        + '<div style="font-size:11px;color:#666;margin-top:6px">'
        +   'チェック担当は独り立ちの方のみです。研修中・稼働前の方、清掃担当ご本人は出ません。</div>'
        // ★v7.79 なぜ出ないのかを書く。黙って消すとマスタが直らない
        + (chkSame.length
          ? '<div style="font-size:11px;color:#666;margin-top:4px">'
            + '清掃担当のため候補から外しています: '+esc(chkSame.map(function(s){return s.disp;}).join('・'))
            + '</div>' : '')
        + (!datesOk
          ? '<div class="box ng" style="margin-top:7px;font-size:11.5px">'
            + '🔴 スタッフマスタの研修開始日・独り立ち日が1件も読めていません。'
            + '列の名前がずれている可能性があります。<br>'
            + '　　いまは研修中・稼働前の方だけを除いています（従来どおり）。<br>'
            + '　　AssignApply.gs → previewCheckEligibility() で原因が分かります。'
            + '</div>' : '')
        + (chkNoDate.length
          ? '<div class="box ng" style="margin-top:7px;font-size:11.5px">'
            + '🔴 スタッフマスタに研修開始日・独り立ち日が入っていないため、'
            + 'チェック担当にできない方がいます<br>'
            + '　　'+esc(chkNoDate.map(function(s){return s.disp;}).join('・'))
            + '<br>　　独り立ちの方であれば、スタッフマスタの「独り立ち日」を入れてください。'
            + '</div>' : '')
        + (ED.chk.length
          ? '<div class="lb" style="margin:12px 0 6px">チェック対応日</div>'
            + '<div class="pills">'
            + chkDates.map(function(d){
                const w = new Date(d+'T00:00:00').getDay();
                const lbl = fmtMD(d)+'('+WD[w]+')'+(d===ED.date?' 清掃と同じ日':'');
                return pillHtml(lbl, (ED.chkDate||ED.date)===d, 'setChkDate('+q(d)+')',
                                holName(d) || '', isRedDay(d) ? 'hol' : ''); }).join('')
            + '</div>'
            + (j.nextIn ? '<div style="font-size:11px;color:#666;margin-top:6px">次回IN '
                + esc(fmtMD(j.nextIn))+' '+esc(j.inT||'')+' まで</div>' : '')
            + '<div class="lb" style="margin:12px 0 6px">チェック時刻</div>'
            + '<div class="stp"><button onclick="bumpChkTime(-1)">−</button>'
            +   '<span class="v">'+esc(ED.chkTime||'--:--')
            +     '<small>'+(ED.end?'清掃終了 '+esc(ED.end)+' の直後を目安に':'30分ずつ')+'</small></span>'
            +   '<button onclick="bumpChkTime(1)">＋</button></div>'
          : '')
        + '</div>'
      : '')

    // ★v7.56 新しく依頼する人がいるときだけ、特記事項の欄を出す
    + (addNames.length
        ? '<div class="sec"><div class="lb">'+esc(addNames.join('・'))+' さんへの特記事項（任意）</div>'
          + '<textarea id="ed-note" rows="3" oninput="setNote(this.value)" '
          + 'placeholder="例）鍵は玄関前のキーボックス（1234）。ゴミ出しは火曜の朝です。" '
          + 'style="width:100%;padding:10px;font-size:14px;font-family:inherit;'
          + 'border:1px solid var(--line);border-radius:10px;resize:vertical">'+esc(ED.note)+'</textarea>'
          + '<div class="box info" style="margin-top:9px">📨 保存すると<b>'+esc(addNames.join('・'))
          + '</b> さんへLINEで依頼が届きます。<br>'
          + '<b>[お受けします] を押してもらうと確定</b>になります。'
          + '<br><span style="font-weight:400">押されるまでは「指名済（返事待ち）」です。'
          + '断られた場合はその方だけ担当から外れ、管理グループへ通知します。</span></div></div>'
        : '')
    + (info ? '<div class="sec">'+info+'</div>' : '')
    + (ED.err ? '<div class="sec"><div class="box ng">'+esc(ED.err)+'</div></div>' : '')

    + '<div class="bar"><button class="c" onclick="closeEdit()">やめる</button>'
    +   '<button class="s" id="ed-save" onclick="saveEdit()"'+(ED.busy?' disabled':'')+'>'
    +   (ED.busy ? '保存しています…' : 'この内容で保存')+'</button></div>';
}

// ★v7.45 オーナー対応の一覧。タップすれば担当を付け替えて一覧に戻せる
function showOwner(){
  const list = DATA.ownerJobs || [];
  if(!list.length) return;
  ED = null;
  $('sheet').innerHTML =
      '<div class="hd"><b>オーナー対応</b><small>'+list.length+'件。一覧には出していません</small></div>'
    + '<div class="sec"><div class="lb">担当を付け替えると一覧に戻ります</div>'
    +   '<div class="pills">'+list.map(function(o){
          const q = "openOwner('" + String(o.jobKey).replace(/'/g,"") + "')";
          return '<button class="pill" onclick="'+q+'">'
               + esc(fmtMD(o.ymd))+'　'+esc(o.prop)+'</button>'; }).join('')+'</div></div>'
    + '<div class="bar"><button class="c" onclick="closeEdit()">閉じる</button></div>';
  $('ovl').classList.add('on');
}
function openOwner(jobKey){
  const o = (DATA.ownerJobs||[]).find(function(x){ return x.jobKey===jobKey; });
  if(!o) return;
  ED = { j: { row:o.row, jobKey:o.jobKey, ver:o.ver, ymd:o.ymd, wd:'', prop:o.prop, pid:o.pid,
              start:'', end:'', std:'', staff:['オーナー'], chk:[], need:'' },
         staff:['オーナー'], chk:[], need:'', busy:false, err:'' };
  drawEdit();
}

function saveEdit(){
  if(!ED || ED.busy) return;
  ED.busy = true; ED.err = ''; drawEdit();
  const j = ED.j;
  // ★v7.57【変えたものだけ送る】
  //   触っていない項目まで送ると、サーバー側が「変更した」と誤判定する。
  //   清掃日が空の行は ymd がチェックアウト日で埋まるため、毎回「日付を変えた」ことになっていた。
  const it = { row: j.row, jobKey: j.jobKey, ver: (j.ver==null?'':String(j.ver)) };
  const same = function(a,b){ return JSON.stringify(a)===JSON.stringify(b); };
  if(!same(ED.staff, j.staff||[]))    it.staff = ED.staff;
  if(!same(ED.chk,   j.chk||[]))      it.chk   = ED.chk;
  if(ED.need    !== String(j.need||''))    it.need    = ED.need;
  if(ED.start   !== (j.start||''))         it.start   = ED.start;
  if(ED.end     !== (j.end||''))           it.end     = ED.end;
  if(ED.date    !== j.ymd)                 it.date    = ED.date;
  if(ED.chkDate !== (j.chkDate||''))       it.chkDate = ED.chkDate;
  if(ED.chkTime !== (j.chkTime||''))       it.chkTime = ED.chkTime;
  if(ED.memo) it.memo = ED.memo;
  if(ED.note) it.note = ED.note;

  if(Object.keys(it).length <= 3){
    ED.busy = false; ED.err = '変更されていません。'; drawEdit(); return;
  }
  const payload = { items: [it] };

  jsonp(GAS_URL+'?mode=ab_apply&userId='+encodeURIComponent(me.userId)
        +'&payload='+encodeURIComponent(JSON.stringify(payload)))
  .then(function(res){
    if(res && res.ok){
      closeEdit();
      $('msg').className = 'msg';
      $('msg').textContent = res.message || '保存しました。';
      reload();
      return;
    }
    let m = (res && res.message) || '保存できませんでした。';
    if(res && res.ng && res.ng.length){
      m += '\n\n' + res.ng.map(function(x){ return '・'+x.prop+'：'+x.why; }).join('\n');
    }
    if(res && res.why) m += '\n\n【原因】'+res.why;
    ED.busy = false; ED.err = m; drawEdit();
    try { $('sheet').scrollTop = 0; } catch(e){}      // ★v7.57 エラーを見落とさないよう先頭へ
  })
  .catch(function(err){
    ED.busy = false;
    ED.err = '通信できませんでした。電波の良い場所でもう一度お試しください。\n\n（'+err.message+'）';
    drawEdit();
  });
}

function draw(){
  if(!DATA) return;
  if(TAB==='staff') drawStaff(); else drawJobs();
}

function render(d){
  DATA = d;
  $('msg').className='msg'; $('msg').textContent='';
  $('lead').textContent = d.name+' さん　'+fmtMD(d.from)+'〜'+fmtMD(d.to)+' の予定　'+APP_VER;
  $('tabs').style.display='flex';
  // ★v7.51 スタッフタブでもエリアで絞れる。物件と「決まっていない日だけ」は予定タブだけ
  $('filt').style.display = 'block';
  $('r-prop').style.display = (TAB==='jobs') ? 'flex' : 'none';
  $('r-bad').style.display  = (TAB==='jobs') ? 'flex' : 'none';

  // ★v7.51 エリア → 物件 の順で絞る。エリアが1つだけの人には出さない
  const labels = d.areaLabels || {};
  const aids = Object.keys(labels);
  const keepA = $('f-area').value;
  let aopt = '<option value="">すべて</option>';
  aids.forEach(function(a){ aopt += '<option value="'+esc(a)+'">'+esc(labels[a]||a)+'</option>'; });
  $('f-area').innerHTML = aopt;
  if(keepA && aids.indexOf(keepA)>=0) $('f-area').value = keepA;
  $('r-area').style.display = (aids.length > 1) ? 'flex' : 'none';

  fillProps();

  $('rel').style.display='block';
  // ★★v8.29 古い案内が残っていた（あなたの指摘 2026-08-30）。
  //   段4（v7.55）で清掃日も時刻もこの画面から変えられるようになっているのに、
  //   段1のときの「まだ変えられません（スプレッドシートか本部へ）」が残っていた。
  //   ＝ 使える機能を、案内が塞いでいた。
  $('foot').innerHTML =
      '予定や未アサインの箱をタップすると<b>担当・募集人数・清掃日・時刻・チェック担当</b>を変えられます。<br>'
    + '過去の予定は変更できません。移動時間は実測（Googleマップ）です。';
  draw();
}

async function reload(){ await load(); }

async function load(){
  $('body').innerHTML='<div class="center">読み込み中…</div>';
  try{
    const days = $('f-days').value || '14';
    const res = await jsonp(GAS_URL+'?mode=ab_board&days='+encodeURIComponent(days)
                 +'&userId='+encodeURIComponent(me.userId));
    if(!res || !res.ok){
      // ★v7.34 なぜ開けないのかまで出す。「権限がありません」だけだと原因に辿り着けない
      let msg = (res && res.message) || '読み込めませんでした。';
      if(res && res.why) msg += '\n\n【原因】' + res.why;
      showErr(msg); return;
    }
    render(res);
  }catch(err){
    showErr('読み込みに失敗しました。\n電波の良い場所でもう一度お試しください。\n\n（'+err.message+'）');
  }
}

(async function(){
  // ★v7.34 ?debug=<Uxxxx> のように山カッコごと貼られる事故が起きたので、掃除してから使う
  const dbg = (new URLSearchParams(location.search).get('debug') || '')
                .replace(/[​-‍﻿]/g,'')
                .replace(/[\s　]+/g,'')
                .replace(/^[<＜"'“”]+/,'')
                .replace(/[>＞"'“”]+$/,'')
                .trim();
  if(dbg){
    me = { userId: dbg, name: '(debug)' };
    load();
    return;
  }
  if(!LIFF_ID){
    // ★v7.43 ここに来たら、たいてい【古いファイルをキャッシュから読んでいる】。
    //   LIFF_ID は v7.42 で設定済みなので、未設定＝古い版を見ている、と考えてよい。
    showErr('古い画面を読み込んでいます（'+APP_VER+' より前）。\n\n'
          + 'LINEのアプリ内ブラウザがキャッシュを持っています。\n'
          + 'LINE Developers のエンドポイントURLの末尾 ?v= の数字を上げてください。\n\n'
          + 'PCの場合は Cmd+Shift+R で読み直してください。');
    return;
  }
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }
    const prof = await liff.getProfile();
    me = { userId: prof.userId, name: prof.displayName };
    load();
  }catch(e){
    showErr('LINEの情報を取得できませんでした。\nLINEアプリから開き直してください。\n\n（'+e.message+'）');
  }
})();
</script>
