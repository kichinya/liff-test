<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>アサイン管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --green:#2e7d32; --line:#e0e0e0; --bg:#f7f8f7; --ink:#222; --sub:#666;
         --red:#c62828; --redbg:#ffebee; --amber:#a06a00; --amberbg:#fff8e1; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  .wrap{ max-width:640px; margin:0 auto; padding:14px 14px 40px; }
  h1{ font-size:18px; margin:4px 0 2px; display:flex; align-items:center; gap:8px; }
  .lead{ color:var(--sub); font-size:12px; margin:0 0 10px; }
  .msg{ font-size:13px; margin:10px 0; white-space:pre-wrap; }
  .msg.err{ color:var(--red); background:var(--redbg); border:1px solid #ef9a9a;
            border-radius:10px; padding:12px; }
  .center{ text-align:center; color:var(--sub); font-size:13px; padding:24px 8px; }

  /* タブ */
  .tabs{ display:flex; gap:6px; margin:0 0 12px; }
  .tabs button{ flex:1; padding:10px 6px; font-size:13px; font-weight:700; font-family:inherit;
    border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:10px; }
  .tabs button.on{ background:var(--green); border-color:var(--green); color:#fff; }

  /* 絞り込み */
  .filt{ background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:10px 12px; margin-bottom:12px; }
  .filt .r{ display:flex; align-items:center; gap:8px; margin:6px 0; }
  .filt .r:first-child{ margin-top:0; }
  .filt label{ font-size:12px; color:var(--sub); white-space:nowrap; min-width:52px; }
  .filt select{ flex:1; padding:8px; font-size:14px; font-family:inherit;
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  .filt .chk{ display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; }
  .filt .chk input{ width:20px; height:20px; accent-color:#c62828; }

  /* サマリ */
  .sum{ display:flex; gap:8px; margin:0 0 6px; }
  .sum > div{ flex:1; background:#fff; border:1px solid var(--line); border-radius:12px;
              padding:10px 8px; text-align:center; }
  .sum b{ display:block; font-size:22px; line-height:1.2; }
  .sum span{ font-size:11px; color:var(--sub); }
  .sum .bad b{ color:var(--red); }
  .sum .warn b{ color:var(--amber); }

  .area{ margin:20px 0 8px; font-size:14px; font-weight:700;
         display:flex; align-items:center; gap:8px; }
  .area .cnt{ font-weight:400; font-size:12px; color:var(--sub); }
  .grp{ margin:14px 0 6px; font-size:13px; font-weight:700; }
  .grp.bad{ color:var(--red); } .grp.warn{ color:var(--amber); } .grp.ok{ color:var(--green); }

  .job{ background:#fff; border:1px solid var(--line); border-radius:12px;
        padding:11px 12px; margin-bottom:8px; }
  .job.bad{ border-color:#ef9a9a; background:#fffafa; }
  .job.past{ opacity:.62; }
  .job .top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .job .d{ font-size:13px; font-weight:700; }
  .job .d .today{ color:#fff; background:var(--green); border-radius:6px;
                  font-size:10px; padding:1px 6px; margin-left:6px; }
  .job .p{ font-size:14px; font-weight:700; flex:1; min-width:120px; }
  .job .t{ font-size:12px; color:var(--sub); }
  .job .rows{ margin-top:7px; display:grid; grid-template-columns:auto 1fr; gap:3px 8px;
              font-size:12.5px; align-items:baseline; }
  .job .k{ color:var(--sub); white-space:nowrap; }
  .job .v.none{ color:var(--red); font-weight:700; }
  .job .memo{ margin-top:6px; font-size:12px; color:var(--sub);
              background:var(--amberbg); border-radius:8px; padding:6px 8px; }
  /* ★v7.36 未アサイン行の「この日シフトを出している人」 */
  .cand{ margin-top:8px; font-size:12px; color:#1b5e20; background:#e8f5e9;
         border:1px solid #a5d6a7; border-radius:8px; padding:7px 9px; font-weight:700; }
  .cand.none{ color:#8d6e63; background:#fafafa; border-color:var(--line); font-weight:400; }
  .cand .chips{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .cand .chip{ display:inline-block; background:#fff; border:1px solid #a5d6a7;
               border-radius:999px; padding:3px 10px; font-weight:700; color:#222; }
  .cand .chip i{ font-style:normal; margin-left:5px; font-size:10px; font-weight:700;
                 color:#a06a00; background:var(--amberbg); border-radius:5px; padding:0 5px; }
  /* ★v7.36 スタッフの提出シフト（日付そのもの） */
  .days{ display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
  .days span{ font-size:11px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:#333; }
  .days span.sat{ color:#1565c0; border-color:#90caf9; background:#e3f2fd; }
  .days span.sun{ color:#c62828; border-color:#ef9a9a; background:var(--redbg); }
  /* ★v7.42 別日のチェック専用カード */
  .job.chk{ background:#f8fbff; border-color:#bbdefb; }
  .tag{ display:inline-block; font-size:11px; border-radius:6px; padding:1px 6px;
        margin-left:6px; border:1px solid var(--line); color:var(--sub); }
  .tag.sd{ color:#b71c1c; border-color:#ef9a9a; background:var(--redbg); }

  /* スタッフ */
  .st{ background:#fff; border:1px solid var(--line); border-radius:12px;
       padding:11px 12px; margin-bottom:8px; }
  .st.off{ opacity:.55; }
  .st .n{ font-size:14px; font-weight:700; }
  .st .rows{ margin-top:6px; display:grid; grid-template-columns:auto 1fr; gap:3px 8px;
             font-size:12.5px; align-items:baseline; }
  .st .k{ color:var(--sub); white-space:nowrap; }
  .badge{ display:inline-block; font-size:11px; border-radius:6px; padding:1px 7px; margin-left:7px; }
  .badge.tr{ background:var(--amberbg); color:var(--amber); border:1px solid #ffe082; }
  .badge.so{ background:#e8f5e9; color:var(--green); border:1px solid #a5d6a7; }
  .badge.ng{ background:var(--redbg); color:var(--red); border:1px solid #ef9a9a; }
  .badge.ck{ background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; }  /* ★v7.42 別日のチェック */
  /* ★v7.63 その時刻を誰が決めたか */
  .badge.by{ background:#ede7f6; color:#4527a0; border:1px solid #b39ddb; }
  .badge.def{ background:#f2f3f5; color:#8a8f96; border:1px solid var(--line); }
  /* ★v7.73 仮アサイン（返事待ち）が確定と同じ見た目だった。社長指摘 2026-08-27 */
  .badge.wt{ background:#fff8e1; color:#8a6d00; border:1px solid #ffe082; }
  .badge.ov{ background:var(--redbg); color:var(--red); border:1px solid #ef9a9a; font-weight:800; }
  .badge.okd{ background:#e8f5e9; color:var(--green); border:1px solid #a5d6a7; }

  /* ★v7.50 案E スタッフ別ルート */
  .strip{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; }
  .strip .dd{ flex:0 0 auto; width:54px; border:1px solid var(--line); border-radius:11px;
              padding:6px 0 5px; text-align:center; background:#fff; cursor:pointer; }
  .strip .dd .w{ font-size:10.5px; color:var(--sub); font-weight:700; }
  .strip .dd .n{ font-size:17px; font-weight:800; line-height:1.25; }
  .strip .dd .m{ font-size:10px; color:var(--sub); }
  .strip .dd.sat .n{ color:#1565c0; } .strip .dd.sun .n{ color:var(--red); }
  /* ★v7.78 祝日 */
  .strip .dd.hol .n{ color:var(--red); }
  .strip .dd.hol .w{ color:var(--red); }
  .strip .dd .h{ font-size:8.5px; color:var(--red); font-weight:700; line-height:1.2;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .strip .dd.on .h{ color:#ffe0e0; }
  .dayhd.red{ color:var(--red); }
  .dayhd .hol{ font-size:12px; color:var(--red); font-weight:700; margin-left:8px; }
  .pill.hol{ color:var(--red); border-color:#f4b6b6; }
  .pill.on.hol{ color:#fff; }
  .strip .dd.on{ background:var(--green); border-color:var(--green); }
  .strip .dd.on .n,.strip .dd.on .w,.strip .dd.on .m{ color:#fff; }
  .strip .pips{ display:flex; justify-content:center; gap:3px; margin-top:3px; height:7px; }
  .pip{ display:inline-block; width:7px; height:7px; border-radius:50%; }
  .pip.r{ background:var(--red); } .pip.y{ background:#f9a825; }
  .pip.w{ background:#8a6d00; }                 /* ★v7.73 返事待ちがある日 */
  .dayhd{ font-size:17px; font-weight:800; margin:6px 0 8px; }
  .dayhd small{ font-size:12px; color:var(--sub); font-weight:600; margin-left:8px; }
  .dayhd .today{ color:#fff; background:var(--green); border-radius:6px;
                 font-size:10px; padding:2px 7px; margin-left:7px; vertical-align:middle; }
  .tray{ background:#fff; border:2px dashed #ef9a9a; border-radius:12px; padding:9px 10px; margin-bottom:10px; }
  .tray .th{ font-size:12px; font-weight:800; color:var(--red); margin:0 0 7px; }
  .tray .th.y{ color:var(--amber); margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); }
  /* ★v7.73 返事待ちの箱。未アサインでも確定でもない「宙ぶらりん」を可視化する */
  .tray .th.w{ color:#8a6d00; margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); }
  .tcard.w{ background:#fffdf5; border:1px dashed #d8c48a; }
  .tcard.w .n{ color:#8a6d00; }
  .tcard.w.ov{ background:var(--redbg); border:1px solid #ef9a9a; }
  .tcard.w.ov .n{ color:var(--red); }
  .tcard{ display:flex; align-items:center; gap:9px; background:var(--redbg); border:1px solid #ffcdd2;
          border-radius:9px; padding:8px 10px; margin-bottom:6px; cursor:pointer; }
  .tcard.y{ background:var(--amberbg); border-color:#ffe082; }
  .tcard:last-child{ margin-bottom:0; }
  .tcard .p{ font-weight:800; font-size:13.5px; flex:1; min-width:0; }
  .tcard .p small{ display:block; font-weight:400; font-size:11px; color:#8d6e63; }
  .tcard .n{ font-size:11px; font-weight:800; color:var(--red); white-space:nowrap; text-align:right; }
  .tcard.y .n{ color:var(--amber); }
  .tcard .n em{ display:block; font-style:normal; font-size:10px; font-weight:400; color:var(--sub); }
  .lane{ background:#fff; border:1px solid var(--line); border-radius:13px; overflow:hidden; margin-bottom:9px; }
  .lane>.hd{ display:flex; align-items:center; gap:7px; padding:9px 11px; background:#f7f8f7;
             border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .lane>.hd .nm{ font-weight:800; font-size:14.5px; }
  .lane>.hd .sum{ margin-left:auto; font-size:11.5px; color:var(--sub); font-weight:700; }
  .lane>.hd .mv{ font-size:11px; color:var(--sub); border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .badge.ot{ background:#eef0f2; color:#4b5563; border:1px solid #d3d7dc; }
  .lane .body{ padding:9px 10px; }
  .stop{ display:flex; gap:9px; align-items:flex-start; cursor:pointer; }
  .stop+.stop{ margin-top:6px; }
  .stop .tm{ width:46px; flex:0 0 auto; text-align:right; font-size:12px; font-weight:800;
             color:#374151; padding-top:9px; }
  .stop .tm small{ display:block; font-weight:400; font-size:10.5px; color:var(--sub); }
  .stop .bx{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px;
             padding:8px 10px; background:#fff; }
  .stop.g .bx{ border-left:4px solid var(--green); }
  .stop.y .bx{ border-left:4px solid #f9a825; }
  .stop.b .bx{ border-left:4px solid #1565c0; background:#f8fbff; }
  .stop .bx .p{ font-weight:800; font-size:13.5px; }
  .stop .bx .d{ font-size:11.5px; color:var(--sub); margin-top:2px; }
  .hop{ display:flex; gap:9px; align-items:center; margin:5px 0; }
  .hop .tm{ width:46px; flex:0 0 auto; }
  .hop .ln{ flex:1; display:flex; align-items:center; gap:7px; font-size:11px;
            color:var(--sub); font-weight:700; }
  .hop .ln:before,.hop .ln:after{ content:''; height:1px; background:var(--line); flex:1; }
  .sec2{ margin:16px 0 7px; font-size:12px; font-weight:800; color:var(--sub); }
  .freerow{ display:flex; flex-wrap:wrap; gap:6px; }
  .fchip{ background:#fff; border:1px solid var(--line); border-radius:999px;
          padding:5px 12px; font-size:12.5px; font-weight:700; }
  .fchip i{ font-style:normal; margin-left:5px; font-size:10px; color:var(--amber);
            background:var(--amberbg); border-radius:5px; padding:0 5px; }
  .fchip u{ text-decoration:none; margin-left:5px; font-size:11px; font-weight:400; color:var(--sub); }

  /* ★v7.45 担当を決めるシート（段2） */
  .ovl{ position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:50;
        display:none; align-items:flex-end; }
  .ovl.on{ display:flex; }
  .sheet{ background:#fff; width:100%; max-height:92vh; overflow-y:auto;
          border-radius:16px 16px 0 0; }
  .sheet .hd{ position:sticky; top:0; background:#fff; padding:14px 16px 10px;
              border-bottom:1px solid var(--line); }
  .sheet .hd b{ font-size:16px; }
  .sheet .hd small{ display:block; color:var(--sub); font-size:12px; font-weight:400; margin-top:2px; }
  .sheet .sec{ padding:12px 16px; border-bottom:1px solid #f0f1f3; }
  .sheet .lb{ font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:7px; }
  .pills{ display:flex; flex-wrap:wrap; gap:7px; }
  .pill{ border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13.5px;
         font-weight:700; background:#fff; color:#333; font-family:inherit; cursor:pointer; }
  .pill.on{ background:#f1f8f2; border-color:var(--green); color:var(--green);
            box-shadow:inset 0 0 0 1px var(--green); }
  .pill i{ font-style:normal; margin-left:5px; font-size:10.5px; color:var(--amber);
           background:var(--amberbg); border-radius:5px; padding:0 5px; }
  .pill.off{ opacity:.45; }
  /* ★v7.72 候補はピル＋バッジに戻す（1人1行はスクロールが長くて選びにくい・社長指摘） */
  .pill.ng{ border-color:#ef9a9a; background:#fffafa; color:#b71c1c; }
  .pill.on.ng{ background:#fff3f3; border-color:#e53935; color:#b71c1c;
               box-shadow:inset 0 0 0 1px #e53935; }
  .pill.ask{ border-style:dashed; color:#8a6d00; }
  /* ★v7.76 要確認。赤（＝だめ）ではなく橙（＝判断してください） */
  .pill.warn{ border-color:#f0b429; background:#fffaf0; color:#8a5a00; }
  .pill.on.warn{ background:#f1f8f2; border-color:var(--green); color:var(--green);
                 box-shadow:inset 0 0 0 1px var(--green); }
  .pill.warn i.b{ color:#8a5a00; background:#fdf0d5; }
  /* ★v7.73 返事待ちは「選択済みの緑」にしない。押されるまでは決まっていない */
  .pill.on.wait{ background:#fffdf5; border:1px dashed #d8c48a; color:#8a6d00; box-shadow:none; }
  .pill.on.wait i.b{ color:#8a6d00; background:#fdf6e3; }
  .pill i.b{ color:#2e6da4; background:#eaf2fa; }      /* 他に予定がある */
  .pill.ng i.b{ color:#b71c1c; background:#fdeaea; }   /* 回れない */
  .pill.ask i.b{ color:#8a6d00; background:#fdf6e3; }  /* シフト未提出 */
  /* ★v7.72 選んだ人だけ、その日の予定と移動時間を下に出す */
  .cds{ display:flex; flex-direction:column; gap:6px; margin-top:9px; }
  .cd{ border:1px solid var(--line); border-left:3px solid #90a4ae; border-radius:9px;
       padding:7px 10px; background:#fbfcfd; font-size:11.5px; color:var(--sub);
       white-space:pre-wrap; line-height:1.55; }
  .cd b{ display:block; font-size:12.5px; color:#222; margin-bottom:2px; }
  .cd.ng{ border-color:#ef9a9a; border-left-color:#e53935; background:#fffafa;
          color:#b71c1c; font-weight:700; }
  .cd.ng b{ color:#b71c1c; }
  /* ★v7.64 候補の行（その日の予定と移動時間つき） */
  .srows{ display:flex; flex-direction:column; gap:7px; }
  .srow{ display:block; width:100%; text-align:left; font-family:inherit; cursor:pointer;
         border:1px solid var(--line); border-radius:11px; padding:9px 12px; background:#fff; }
  .srow.on{ background:#f1f8f2; border-color:var(--green); box-shadow:inset 0 0 0 1px var(--green); }
  .srow.ng{ border-color:#ef9a9a; background:#fffafa; }
  .srow.ask{ background:#fbfbfb; }
  .srow.ask .s{ color:#a06a00; }
  .srow.on.ng{ background:#fff3f3; }
  .srow .n{ display:block; font-size:14px; font-weight:800; color:#222; }
  .srow.on .n{ color:var(--green); }
  .srow .n i{ font-style:normal; margin-left:6px; font-size:10.5px; font-weight:700;
              color:var(--amber); background:var(--amberbg); border-radius:5px; padding:0 5px; }
  .srow .n u{ text-decoration:none; margin-left:6px; font-size:11px; font-weight:400; color:var(--sub); }
  .srow .s{ display:block; margin-top:3px; font-size:11.5px; color:var(--sub);
            white-space:pre-wrap; line-height:1.5; }
  .srow.ng .s{ color:#b71c1c; font-weight:700; }
  /* ★v7.77 回る順番のドラッグ並べ替え */
  .rodb{ margin-left:8px; font-size:11px; font-weight:800; font-family:inherit; cursor:pointer;
         border:1px solid var(--line); background:#fff; color:#2e6da4; border-radius:8px; padding:2px 9px; }
  .rrow{ display:flex; align-items:stretch; gap:9px; background:#fff; border:1px solid var(--line);
         border-radius:11px; padding:9px 10px; margin-bottom:7px; }
  .rrow.drag{ opacity:.35; }
  .rrow.moved{ border-color:#90caf9; background:#f5fbff; }
  .rrow .gr{ width:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center;
             font-size:19px; color:#9aa0a6; cursor:grab; touch-action:none; user-select:none;
             border-right:1px dashed var(--line); }
  .rrow .in{ flex:1; min-width:0; }
  .rrow .in .p{ font-size:13.5px; font-weight:800; color:#222; }
  .rrow .in .t{ font-size:12px; color:var(--sub); margin-top:2px; }
  .rrow .in .t b{ color:#1565c0; }
  .rrow .in .t s{ color:#b0b4b9; }
  .rrow .in .w{ font-size:11px; color:var(--red); font-weight:700; margin-top:3px; }
  .rhop{ font-size:11px; color:var(--sub); margin:-3px 0 7px 44px; }
  .rhop.ng{ color:var(--red); font-weight:700; }
  .rghost{ position:fixed; z-index:99; pointer-events:none; opacity:.92;
           box-shadow:0 6px 18px rgba(0,0,0,.22); }
  .stp{ display:flex; align-items:center; gap:10px; }
  .stp button{ width:44px; height:40px; border:1px solid var(--line); border-radius:10px;
               background:#fff; font-size:19px; font-weight:800; color:#333; font-family:inherit; }
  .stp .v{ flex:1; text-align:center; font-size:17px; font-weight:800; }
  .stp .v small{ display:block; font-size:11px; color:var(--sub); font-weight:600; }
  .box{ border-radius:10px; padding:9px 11px; font-size:12.5px; font-weight:700; }
  .box.ok{ background:#e8f5e9; border:1px solid #a5d6a7; color:#1b5e20; }
  .box.ng{ background:var(--redbg); border:1px solid #ef9a9a; color:#7f1d1d; white-space:pre-wrap; }
  .box.info{ background:#e3f2fd; border:1px solid #90caf9; color:#0d47a1; }
  .bar{ position:sticky; bottom:0; background:#fafbfc; border-top:1px solid var(--line);
        display:flex; gap:9px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar button{ flex:1; border:0; border-radius:11px; padding:13px; font-size:15px;
               font-weight:800; font-family:inherit; }
  .bar .c{ background:#fff; color:#333; border:1px solid var(--line); }
  .bar .s{ background:var(--green); color:#fff; }

<script>
// ============================================================
// アサイン管理ダッシュボード（段1・表示のみ）
//
// ⚠️ この画面は【1セルも書きません】。見るだけです。登録・変更は段2以降。
//
// ★LIFF_ID は LINE Developers でアプリを作ってから差し替えます。
//   それまでは PC のブラウザで
//     assign.html?debug=<管理者のLINE userId>
//   と開けば、LIFF なしで中身を確認できます。
// ============================================================
const LIFF_ID = '2010751229-89yq6FEa';   // ★v7.42 アサイン管理（管理者のみ）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx_ubqKRZeQfNL7qIiElNzE0iTjvq7487Hzx3xor8P4M-u55hF7-EL0n8G-5nYofc_sXg/exec';

const $ = function(id){ return document.getElementById(id); };
// ★v7.42 日付の書き方を1か所に集約。予定=8/29(土) / シフト=8/29（0詰めなし）
// ★v7.43 画面に版数を出す。LINEはキャッシュが強く「どのファイルを見ているか」が分からなくなる。
//   ここが古いままなら、エンドポイントURLの ?v= を上げてください。
const APP_VER = 'v7.81';
// ============================================================
// ★v7.78【祝日を赤で出す】社長指摘 2026-08-27
//   土日は色を分けていたのに祝日は平日と同じ色だった。
//   民泊はチェックアウトが祝日に固まる。ここを見落とすと手配が丸ごと遅れる。
//
//   ⚠️ 外部のカレンダーAPIは引かない。通信が増えるし、
//      LIFFが開かないときに原因の切り分けができなくなる。
//      日本の祝日は計算で出せる（春分・秋分は1980〜2099年で正しい近似式）。
//   ⚠️ 振替休日（日曜が祝日→翌平日）と国民の休日（祝日に挟まれた平日）も見る。
// ============================================================
var HOL_TBL = {};
function ymdOf(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function holTable(y){
  if(HOL_TBL[y]) return HOL_TBL[y];
  var k = function(mm,dd){ return y+'-'+('0'+mm).slice(-2)+'-'+('0'+dd).slice(-2); };
  var nthMon = function(mm,n){                 // その月の第n月曜
    var d = new Date(y, mm-1, 1);
    return 1 + ((8 - d.getDay()) % 7) + (n-1)*7;
  };
  var eq = function(a,b){                      // 春分・秋分（1980〜2099）
    return Math.floor(a + b*(y-1980) - Math.floor((y-1980)/4));
  };
  var t = {};
  t[k(1,1)]   = '元日';
  t[k(1, nthMon(1,2))]   = '成人の日';
  t[k(2,11)]  = '建国記念の日';
  t[k(2,23)]  = '天皇誕生日';
  t[k(3, eq(20.8431,0.242194))] = '春分の日';
  t[k(4,29)]  = '昭和の日';
  t[k(5,3)]   = '憲法記念日';
  t[k(5,4)]   = 'みどりの日';
  t[k(5,5)]   = 'こどもの日';
  t[k(7, nthMon(7,3))]   = '海の日';
  t[k(8,11)]  = '山の日';
  t[k(9, nthMon(9,3))]   = '敬老の日';
  t[k(9, eq(23.2488,0.242194))] = '秋分の日';
  t[k(10, nthMon(10,2))] = 'スポーツの日';
  t[k(11,3)]  = '文化の日';
  t[k(11,23)] = '勤労感謝の日';

  // 振替休日：日曜が祝日なら、次の平日（すでに祝日ならさらに次）
  Object.keys(t).slice().forEach(function(d){
    var dt = new Date(d+'T00:00:00');
    if(dt.getDay() !== 0) return;
    var n = new Date(dt.getTime());
    do { n = new Date(n.getTime()+86400000); } while(t[ymdOf(n)]);
    t[ymdOf(n)] = '振替休日';
  });
  // 国民の休日：祝日と祝日に挟まれた平日（9月のシルバーウィーク）
  Object.keys(t).slice().forEach(function(d){
    var dt = new Date(d+'T00:00:00');
    var a = new Date(dt.getTime()+86400000);
    var b = new Date(dt.getTime()+2*86400000);
    if(t[ymdOf(a)] || a.getDay()===0 || a.getDay()===6) return;
    if(t[ymdOf(b)]) t[ymdOf(a)] = '国民の休日';
  });
  HOL_TBL[y] = t;
  return t;
}
function holName(ymd){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd||''))) return '';
  return holTable(+String(ymd).slice(0,4))[ymd] || '';
}
/** 赤で出す日か（日曜 or 祝日） */
function isRedDay(ymd){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd||''))) return false;
  return new Date(ymd+'T00:00:00').getDay() === 0 || !!holName(ymd);
}

const fmtMD = function(d){ if(!d) return ''; const p=String(d).split('-'); return (+p[1])+'/'+(+p[2]); };
const esc = function(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };

let me = null;
let DATA = null;
let TAB = 'jobs';

function jsonp(url){
  return new Promise(function(resolve,reject){
    const cb = 'ab_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const s = document.createElement('script');
    const t = setTimeout(function(){ cleanup(); reject(new Error('時間内に応答がありませんでした')); }, 25000);
    function cleanup(){
      clearTimeout(t);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = function(d){ cleanup(); resolve(d); };
    s.onerror = function(){ cleanup(); reject(new Error('通信に失敗しました')); };
    s.src = url + '&callback=' + cb;
    document.body.appendChild(s);
  });
}

function showErr(text){
  $('msg').className='msg err'; $('msg').textContent=text;
  $('body').innerHTML=''; $('rel').style.display='block';
  $('tabs').style.display='none'; $('filt').style.display='none';
}

function tab(name){
  // ★v7.51 タブごとに出す絞り込みを変える
  TAB = name;
  $('tb-jobs').className  = (name==='jobs')  ? 'on' : '';
  $('tb-staff').className = (name==='staff') ? 'on' : '';
  $('filt').style.display = 'block';
  $('r-prop').style.display = (name==='jobs') ? 'flex' : 'none';
  $('r-bad').style.display  = (name==='jobs') ? 'flex' : 'none';
  draw();
}

// ---- 予定 ----
// ★v7.36 未アサインの行に「その日シフトを出している人」を出す。
//   誰に連絡すればいいかが、この画面だけで分かるようにするため。
function candHtml(j){
  const c = j.cands || [];
  if(!c.length && j.staff && j.staff.length) return '';   // 足りている行には出さない
  if(!c.length){
    if(j.staff && j.staff.length) return '';
    return '<div class="cand none">この日シフトを出している対応可能スタッフはいません</div>';
  }
  // ★v7.38 移動手段は出さない。区分は【その清掃日】時点のものがサーバーから来る
  const chips = c.map(function(x){
    const tr = (x.kind==='研修') ? '<i>研修</i>' : '';
    return '<span class="chip">'+esc(x.disp)+tr+'</span>';
  }).join('');
  return '<div class="cand">📣 この日シフト提出 '+c.length+'名'
       + '<span style="font-weight:400;color:#33691e">（未提出の方はタップして選べます）</span>'
       + '<div class="chips">'+chips+'</div></div>';
}

// ★v7.42 チェック対応日が清掃日と別の日のとき、その日の側に出す専用カード。
//   集計（未アサイン・人数不足）には入れない。親の清掃の行で数えているため。
function checkHtml(j){
  const md = fmtMD;
  const none = !j.staff || !j.staff.length;
  return '<div class="job chk'+(j.isPast?' past':'')+'">'
    +   '<div class="top">'
    +     '<span class="d"'+(isRedDay(j.ymd)?' style="color:var(--red)"':'')+'>'
    +        esc(fmtMD(j.ymd))+'('+esc(j.wd)+')'
    +        (holName(j.ymd)?'<span style="font-size:10.5px;margin-left:5px">'+esc(holName(j.ymd))+'</span>':'')
    +        (j.isToday ? '<span class="today">本日</span>' : '')+'</span>'
    +     '<span class="p">'+esc(j.prop)+' <span class="badge ck">チェック</span></span>'
    +   '</div>'
    +   '<div class="rows">'
    +     '<span class="k">時間</span><span class="v">'+esc(j.chkTime||'--:--')+'</span>'
    +     '<span class="k">担当</span><span class="v'+(none?' none':'')+'">'
    +        (none ? '未定' : esc(j.staff.join('・')))+'</span>'
    +     '<span class="k">清掃</span><span class="v"><span class="t">'
    +        esc(md(j.cleanDate))+'　'+esc((j.cleanStaff||[]).join('・')||'未アサイン')+'</span></span>'
    +   '</div>'
    + '</div>';
}

function jobHtml(j){
  if(j.kind === 'check') return checkHtml(j);
  const noStaff = !j.staff || !j.staff.length;
  const editable = !j.isPast;                       // ★v7.45 過去は編集できない（F-8）
  const cls = 'job' + (noStaff ? ' bad' : '') + (j.isPast ? ' past' : '') + (editable ? ' tap' : '');
  const time = (j.start || '--:--') + '〜' + (j.end || '--:--');
  // ★v7.37 同日INは一番の事故要因（次のゲストが来るまでに終わらせないといけない）
  const isSameDay = !!(j.sameDay && j.sameDay!=='' && j.sameDay!=='×' && j.sameDay!=='なし');
  const sd = isSameDay ? '<span class="tag sd">⚠️ 同日IN '+esc(j.inT||'')+'</span>' : '';

  // ★v7.37 滞在期間 / 宿泊人数 / 次回IN / 次回人数 / 募集人数
  const md = fmtMD;
  const stayTxt = (j.inD && j.outD)
    ? md(j.inD)+'〜'+md(j.outD)+(j.nights ? ' <b>'+j.nights+'泊</b>' : '')
    : '<span class="t">—</span>';
  const guestTxt = j.guests ? '<b>'+esc(j.guests)+'名</b>' : '<span class="t">未入力</span>';

  let nextTxt;
  if(j.nextIn){
    nextTxt = (isSameDay ? '⚠️ ' : '') + md(j.nextIn)
            + (j.inT ? ' '+esc(j.inT) : '')
            + (j.nextGuests ? ' <b>'+esc(j.nextGuests)+'名</b>' : ' <span class="t">人数未入力</span>');
  }else{
    nextTxt = '<span class="t">次の予約なし</span>';
  }

  // 募集人数：足りていなければ赤。決まっていない件数がひと目で分かるように
  const nowN  = (j.staff||[]).length;
  const needN = parseInt(j.need, 10);
  let needTxt = '<span class="t">—</span>';
  if(needN > 0){
    const short = (nowN < needN);
    needTxt = '<b'+(short?' style="color:#c62828"':'')+'>'+nowN+' / '+needN+'名</b>'
            + (short ? ' <span style="color:#c62828;font-weight:700">あと'+(needN-nowN)+'名</span>' : '')
            // ★v7.75 多めに打診しているのは正常な状態。赤くしない
            + (nowN>needN ? ' <span style="color:#2e6da4;font-weight:700">多めに打診中</span>' : '');
  }
  const chkDay = (j.chkDate && j.chkDate !== j.ymd) ? '（'+esc(fmtMD(j.chkDate))+'）' : '';
  // ★v7.35 チェックが要るのは【外注】と【研修中】が入っているジョブだけ。
  //   それ以外は空欄でも「—」と出す（全部に「未定」と出ると本当に見るべき所が埋もれる）
  const hasChk = !!(j.chk && j.chk.length);
  let chkCell;
  if(hasChk){
    chkCell = '<span class="v">'+esc(j.chk.join('・'))+chkDay
            + (j.chkTime ? ' <span class="t">'+esc(j.chkTime)+'</span>' : '')+'</span>';
  }else if(j.needChk){
    chkCell = '<span class="v none">未定 <span class="t">（'+esc(j.chkWhy||'')+'が入っています）</span></span>';
  }else{
    chkCell = '<span class="v"><span class="t">—</span></span>';
  }
  return '<div class="'+cls+'"'
    +   (editable ? ' onclick="openEdit(\''+esc(j.jobKey)+'\','+(j.kind==='check'?'true':'false')+')"' : '')+'>'
    +   '<div class="top">'
    +     '<span class="d">'+esc(fmtMD(j.ymd))+'('+esc(j.wd)+')'
    +        (j.isToday ? '<span class="today">本日</span>' : '')+'</span>'
    +     '<span class="p">'+esc(j.prop)+'</span>'
    +   '</div>'
    +   '<div class="rows">'
    +     '<span class="k">時間</span><span class="v">'+esc(time)
    +        (j.std ? ' <span class="t">/ 標準'+esc(j.std)+'</span>' : '')+sd+'</span>'
    +     '<span class="k">滞在</span><span class="v">'+stayTxt+' <span class="t">/</span> '+guestTxt+'</span>'
    +     '<span class="k">次回IN</span><span class="v'+(isSameDay?' none':'')+'">'+nextTxt+'</span>'
    +     '<span class="k">清掃</span><span class="v'+(noStaff?' none':'')+'">'
    +        (noStaff ? '未アサイン' : staffLabel(j))+'</span>'
    +     '<span class="k">募集人数</span><span class="v">'+needTxt+'</span>'
    +     '<span class="k">チェック</span>'+chkCell
    +     '<span class="k">状態</span><span class="v"><span class="t">'
    +        esc(j.assign||'—')+'</span>'+waitBadge(j)+'</span>'
    +   '</div>'
    +   (j.memo ? '<div class="memo">'+esc(j.memo)+'</div>' : '')
    +   candHtml(j)
    + '</div>';
}
// ★v7.37 募集人数に足りていない＝まだ手配が終わっていない
function isShort(j){
  const n = parseInt(j.need, 10);
  return (n > 0 && (j.staff||[]).length > 0 && (j.staff||[]).length < n);
}
function groupHtml(title, cls, jobs){
  if(!jobs.length) return '';
  return '<div class="grp '+cls+'">'+title+'　'+jobs.length+'件</div>'+jobs.map(jobHtml).join('');
}


// ============================================================
// ★v7.50【案E】1日ぶんを「スタッフ別ルート」で見る
//   軸を物件ではなく人にする。1人＝1レーン。上から順に回る。
//   現場と現場のあいだに移動時間を出すので、無理な組み方に気づける。
//   未アサインは上の赤い箱に置き、タップして担当を決める。
// ============================================================
function dayList(){
  const fa = $('f-area').value;                   // ★v7.51 エリア絞り込み
  const seen = {}, out = [];
  (DATA.areas||[]).forEach(function(a){
    if(fa && a.id !== fa) return;
    a.jobs.forEach(function(j){ if(!seen[j.ymd]){ seen[j.ymd]=1; out.push(j.ymd); } });
  });
  return out.sort();
}
function jobsOf(ymd){
  const fa = $('f-area').value;                   // ★v7.51 エリア絞り込み
  const out = [];
  (DATA.areas||[]).forEach(function(a){
    if(fa && a.id !== fa) return;
    a.jobs.forEach(function(j){ if(j.ymd===ymd) out.push(Object.assign({area:a.id, areaLabel:a.label}, j)); });
  });
  return out;
}
function staffOf(name){
  return (DATA.staff||[]).find(function(s){ return s.disp===name || s.name===name; });
}
function travelMin(pidA, pidB, move){
  if(!pidA || !pidB || pidA===pidB) return null;
  const md = ttMode(move);
  const v = (DATA.travel||{})[pidA+'>'+pidB+'|'+md];
  return (v===undefined) ? null : v;
}
function ttMode(move){
  const s = String(move||'');
  const t = s.replace(/自転車/g,'§').replace(/電車/g,'¶');
  if(/車|自動車|マイカー|バイク|原付|単車/.test(t)) return 'driving';
  if(/¶|バス|公共|地下鉄|モノレール/.test(t))       return 'transit';
  if(/§|チャリ|ロード/.test(t))                     return 'bicycling';
  if(/徒歩|歩き/.test(s))                           return 'walking';
  return 'driving';
}
function moveIcon(move){
  const md = ttMode(move);
  return md==='driving' ? '🚗' : md==='transit' ? '🚃' : md==='bicycling' ? '🚲' : '🚶';
}
function shortOf(j){
  const n = parseInt(j.need,10);
  return (n>0) ? Math.max(0, n - (j.staff||[]).length) : 0;
}

// ★v7.73【仮アサインを確定と同じ見た目にしない】社長指摘 2026-08-27
//   「仮アサインの状態なのに確定したような見た目になっている。
//     返信期限や返答待ちのバッジが付いてた方がいいのでは？
//     仮アサインで出しているのが複数人になる可能性もあるので、
//     物件に対して誰を仮アサインしたのかわかるようにしておく」
//
//   名前が入っている＝手配が済んだ、ではない。
//   本人がボタンを押すまでは【指名済＝返事待ち】で、断られたら振り出しに戻る。
//   返事待ちのまま期限を過ぎたものが、いちばん危ない（誰も気づかないまま当日になる）。
function offerOf(j, name){
  const o = j && j.offer; if(!o) return '';
  if((o.pending||[]).indexOf(name) >= 0) return 'wait';
  if((o.ok||[]).indexOf(name)      >= 0) return 'ok';
  if((o.ng||[]).indexOf(name)      >= 0) return 'ng';
  return '';
}
function waitCount(j){ return ((j&&j.offer&&j.offer.pending)||[]).length; }
// ★v7.81 いま編集中の担当名を、返事の状況つきで並べる（要約表示に使う）
function staffLabelOf(names, j){
  return (names||[]).map(function(n){
    const st = offerOf(j, n);
    return n + (st==='wait' ? ' ⏳' : (st==='ok' ? ' ✅' : ''));
  }).join('・');
}
function isOver(j){ return !!(j && j.offer && j.offer.over && waitCount(j)); }
// 担当名の並び。返事待ちには ⏳、承諾済みには ✅ を付ける
function staffLabel(j){
  return (j.staff||[]).map(function(n){
    const st = offerOf(j, n);
    return esc(n) + (st==='wait' ? ' ⏳' : (st==='ok' ? ' ✅' : ''));
  }).join('・');
}
// 「⏳ 2名の返事待ち（9/1(火) 18:00まで）」／期限切れなら赤
function waitBadge(j){
  const n = waitCount(j); if(!n) return '';
  const o = j.offer, over = isOver(j);
  return '<span class="badge '+(over?'ov':'wt')+'">⏳ '+n+'名 返事待ち'
       + (o.due ? (over ? '／期限切れ '+esc(o.due) : '／'+esc(o.due)+'まで') : '')+'</span>';
}

// ★v7.51 選んだエリアの物件だけを物件セレクトに出す
function fillProps(){
  const a = $('f-area').value;
  const keep = $('f-prop').value;
  let opt = '<option value="">すべて</option>';
  (DATA.props||[]).forEach(function(p){
    if(a && p.area !== a) return;
    opt += '<option value="'+esc(p.pid)+'">'+esc(p.name)+'</option>';
  });
  $('f-prop').innerHTML = opt;
  const still = (DATA.props||[]).some(function(p){ return p.pid===keep && (!a || p.area===a); });
  $('f-prop').value = still ? keep : '';
}
function onArea(){ fillProps(); draw(); }

// ★v7.77 その日の予定を人ごとに束ねる。drawJobs と並べ替えの両方から使う。
//   ⚠️ 物件の絞り込み（f-prop）は掛ける。エリアは jobsOf が既に効かせている。
function lanesOf(ymd){
  const fp = $('f-prop').value;
  const pass = function(j){ return !fp || j.pid===fp; };
  const js = jobsOf(ymd);
  const clean  = js.filter(function(j){ return j.kind!=='check'; });
  const checks = js.filter(function(j){ return j.kind==='check'; });
  const lanes = {};
  const push = function(nm, stop){ (lanes[nm] = lanes[nm] || []).push(stop); };
  clean.filter(pass).forEach(function(j){
    (j.staff||[]).forEach(function(nm){ push(nm, {j:j, kind:'清掃', t:j.start||'', end:j.end||''}); });
  });
  checks.concat(clean.filter(function(j){ return pass(j) && j.chk && j.chk.length && (!j.chkDate || j.chkDate===ymd); }))
    .forEach(function(j){
      (j.chk||[]).forEach(function(nm){ push(nm, {j:j, kind:'チェック', t:j.chkTime||'', end:''}); });
    });
  Object.keys(lanes).forEach(function(nm){
    lanes[nm].sort(function(x,y){ return (x.t||'99:99') < (y.t||'99:99') ? -1 : 1; });
  });
  return lanes;
}

function drawJobs(){
  let days = dayList();
  // ★v7.50「決まっていない日だけ」＝未アサイン・人数不足・チェック未定がある日に絞る
  if($('f-bad').checked){
    const ng = days.filter(function(d){
      return jobsOf(d).some(function(j){
        return j.kind!=='check' && (!j.staff.length || shortOf(j)>0 || j.needChk); });
    });
    if(ng.length) days = ng;
  }
  if(!days.length){ $('body').innerHTML='<div class="center">この期間の予定はありません。</div>'; return; }
  if(!DAY || days.indexOf(DAY)<0) DAY = (days.indexOf(DATA.today)>=0) ? DATA.today : days[0];

  // ---- 日付ストリップ ----
  let strip = '<div class="strip">';
  days.forEach(function(d){
    const js = jobsOf(d).filter(function(j){ return j.kind!=='check'; });
    const bad = js.filter(function(j){ return !j.staff.length || shortOf(j)>0; }).length;
    const wrn = js.filter(function(j){ return j.needChk; }).length;
    const wat = js.filter(function(j){ return waitCount(j)>0; }).length;   // ★v7.73 返事待ち
    const w = new Date(d+'T00:00:00').getDay();
    const hn = holName(d);                                     // ★v7.78 祝日
    strip += '<div class="dd'+(d===DAY?' on':'')+(w===0?' sun':'')+(w===6?' sat':'')
          +  (hn?' hol':'')+'"'
          +  ' onclick="pickDay(\''+d+'\')">'
          +  '<div class="w">'+WD[w]+'</div><div class="n">'+(+d.split('-')[2])+'</div>'
          +  '<div class="m">'+(hn ? '' : (+d.split('-')[1])+'月')+'</div>'
          +  (hn?'<div class="h">'+esc(hn)+'</div>':'')
          +  '<div class="pips">'+(bad?'<i class="pip r"></i>':'')+(wrn?'<i class="pip y"></i>':'')
          +    (wat?'<i class="pip w"></i>':'')+'</div>'
          +  '</div>';
  });
  strip += '</div>';

  const js = jobsOf(DAY);
  const clean = js.filter(function(j){ return j.kind!=='check'; });
  const checks = js.filter(function(j){ return j.kind==='check'; });
  const fp = $('f-prop').value;
  const fa = $('f-area').value;                    // ★v7.76 空いている人の絞り込みにも使う
  const pass = function(j){ return !fp || j.pid===fp; };

  // ---- 未アサインの箱 ----
  const needStaff = clean.filter(function(j){ return pass(j) && (!j.staff.length || shortOf(j)>0); });
  const needChk   = clean.filter(function(j){ return pass(j) && j.needChk; });
  // ★v7.73 返事待ち。人数はそろっているので未アサインの箱には出てこない＝いちばん見落とす
  const waiting   = clean.filter(function(j){ return pass(j) && waitCount(j)>0; })
                         .sort(function(a,b){ return (isOver(a)?0:1)-(isOver(b)?0:1); });
  let tray = '';
  if(needStaff.length || needChk.length || waiting.length){
    tray = '<div class="tray">';
    if(needStaff.length){
      tray += '<div class="th">🔴 未アサイン '+needStaff.length+'件</div>'
           +  needStaff.map(function(j){
                const rest = shortOf(j) || (parseInt(j.need,10)>0 ? 0 : 1);
                return '<div class="tcard" onclick="openEdit(\''+esc(j.jobKey)+'\')">'
                     + '<span class="p">'+esc(j.prop)
                     +   '<small>'+esc(j.start||'--:--')+'〜'+esc(j.end||'--:--')
                     +   (j.std?' ／ 標準'+esc(j.std):'')
                     +   (j.nextIn===j.ymd?' ／ 次回IN '+esc(j.inT||'')+' ⚠️':'')+'</small></span>'
                     + '<span class="n">あと'+rest+'名<em>'+(j.staff.length)+'/'+(j.need||'—')+'</em></span></div>';
              }).join('');
    }
    if(needChk.length){
      tray += '<div class="th y">🟡 チェック未定 '+needChk.length+'件</div>'
           +  needChk.map(function(j){
                return '<div class="tcard y" onclick="openEdit(\''+esc(j.jobKey)+'\',true)">'
                     + '<span class="p">'+esc(j.prop)
                     +   '<small>清掃 '+esc(j.staff.join('・'))+'（'+esc(j.chkWhy||'')+'）</small></span>'
                     + '<span class="n">チェック<em>要 1名</em></span></div>';
              }).join('');
    }
    // ★v7.73 誰に頼んでいて、いつまでに返事が要るのかを物件ごとに出す
    if(waiting.length){
      const nOver = waiting.filter(isOver).length;
      tray += '<div class="th w">⏳ 返事待ち '+waiting.length+'件'
           +  (nOver?'　<span style="color:#c62828">うち期限切れ '+nOver+'件</span>':'')+'</div>'
           +  waiting.map(function(j){
                const o = j.offer||{}, over = isOver(j);
                const pend = (o.pending||[]).join('・');
                const okN  = (o.ok||[]).length;
                return '<div class="tcard w'+(over?' ov':'')+'" onclick="openEdit(\''+esc(j.jobKey)+'\')">'
                     + '<span class="p">'+esc(j.prop)
                     +   '<small>'+esc(j.start||'--:--')+'〜'+esc(j.end||'--:--')
                     +   '　依頼中: '+esc(pend||'—')
                     +   (okN?'　／ 承諾済 '+okN+'名':'')+'</small></span>'
                     + '<span class="n">'+(over?'期限切れ':'返事待ち')
                     +   '<em>'+esc(o.due||'期限なし')+'</em></span></div>';
              }).join('');
    }
    tray += '</div>';
  }

  // ---- 人ごとに束ねる ----（★v7.77 並べ替えからも使うので関数に出した）
  const lanes = lanesOf(DAY);

  const OUT = ['外注','オーナー'];
  const names = Object.keys(lanes).sort(function(a,b){
    const ao = OUT.indexOf(a)>=0?1:0, bo = OUT.indexOf(b)>=0?1:0;
    if(ao!==bo) return ao-bo;
    const sa = (lanes[a][0]||{}).t || '99:99', sb = (lanes[b][0]||{}).t || '99:99';
    return sa < sb ? -1 : 1;
  });

  let body = '';
  names.forEach(function(nm){
    const s = staffOf(nm);
    const isOut = OUT.indexOf(nm)>=0;
    const stops = lanes[nm].sort(function(x,y){ return (x.t||'99:99') < (y.t||'99:99') ? -1 : 1; });
    const k = s ? kindAt(s, DAY) : '';
    const kb = isOut ? '<span class="badge ot">重なりOK</span>'
             : k==='研修' ? '<span class="badge tr">研修中</span>'
             : k==='独り立ち' ? '<span class="badge so">独り立ち</span>'
             : k==='稼働前' ? '<span class="badge ng">稼働前</span>' : '';
    let inner = '';
    stops.forEach(function(st, i){
      if(i>0 && !isOut){
        const prev = stops[i-1];
        const mn = travelMin(prev.j.pid, st.j.pid, s ? s.move : '');
        inner += '<div class="hop"><span class="tm"></span><span class="ln">'
              +  (prev.j.pid===st.j.pid ? '同じ物件' :
                  (moveIcon(s?s.move:'')+' 移動 '+(mn==null?'？':mn)+'分'))+'</span></div>';
      }
      const isChk = st.kind==='チェック';
      const cls = 'stop'+(isChk?' b':(st.j.needChk?' y':' g'));
      inner += '<div class="'+cls+'" onclick="openEdit(\''+esc(st.j.jobKey)+'\','+(isChk?'true':'false')+')">'
            +   '<span class="tm">'+esc(st.t||'--:--')+(st.end?'<small>〜'+esc(st.end)+'</small>':'')+'</span>'
            +   '<div class="bx"><div class="p">'+esc(st.j.prop)
            +     (isChk?' <span class="badge ck">チェック</span>':'')
            +     (!isChk ? (st.j.timeBy
                  ? ' <span class="badge by">🕒 '+esc(st.j.timeBy)+'</span>'
                  : ' <span class="badge def">既定のまま</span>') : '')
            +     // ★v7.73 この人がこの現場の返事をまだしていないなら、そう出す
                  (function(){
                    const o = offerOf(st.j, nm);
                    if(o==='wait') return ' <span class="badge '+(isOver(st.j)?'ov':'wt')+'">⏳ '
                                        + (isOver(st.j)?'期限切れ':'返事待ち')
                                        + (st.j.offer&&st.j.offer.due?' '+esc(st.j.offer.due):'')+'</span>';
                    if(o==='ok')   return ' <span class="badge okd">✅ 承諾</span>';
                    return '';
                  })()+'</div>'
            +     '<div class="d">'
            +       (isChk ? ('清掃 '+esc((st.j.cleanStaff||st.j.staff||[]).join('・')))
                           : ((st.j.nights?st.j.nights+'泊 ':'')+(st.j.guests?st.j.guests+'名 ':'')
                              +(st.j.std?'／ 標準'+esc(st.j.std):'')
                              +(st.j.nextIn?' ／ 次回IN <b>'+esc(fmtMD(st.j.nextIn))+' '+esc(st.j.inT||'')+'</b>'
                                 +(st.j.nextIn===st.j.ymd?' ⚠️':''):'')))
            +     '</div></div></div>';
    });
    // ★v7.77 清掃が2件以上ある人だけ、順番の並べ替えを出す
    const nClean = stops.filter(function(x){ return x.kind==='清掃'; }).length;
    const rodBtn = (!isOut && nClean >= 2)
      ? '<button class="rodb" onclick="event.stopPropagation();startReorder('
        + "'"+String(nm).replace(/'/g,"\\'")+"'" + ')">≡ 順番</button>' : '';
    body += '<div class="lane'+(isOut?' out':'')+'">'
         +  '<div class="hd"><span class="nm">'+esc(nm)+'</span>'+kb
         +    (s&&s.move?'<span class="mv">'+esc(s.move)+'</span>':'')
         +    rodBtn
         +    '<span class="sum">'+stops.length+'件</span></div>'
         +  '<div class="body">'+inner+'</div></div>';
  });

  // ---- シフトは出ているが、まだ入っていない人 ----
  // ★v7.76【エリアで絞ったら、空いている人もそのエリアの人だけ】社長指摘 2026-08-27
  //   湘南で絞っているのに逗子の人が「空いています」と出ると、
  //   声をかけてから「その物件は対応していません」と分かる。手戻りになる。
  const free = (DATA.staff||[]).filter(function(s){
    if(lanes[s.disp]) return false;
    if(fa && (s.areas||[]).indexOf(fa) < 0) return false;                 // エリア絞り込み
    if(fp && !(s.propsAll || (s.props||[]).indexOf(fp) >= 0)) return false; // 物件絞り込み
    const mk = (s.shift||{})[DAY];
    return mk && mk!=='×';
  }).sort(function(a,b){ return a.disp<b.disp?-1:1; });
  let freeHtml = '';
  if(free.length){
    const areaNm = fa ? ((DATA.areas||[]).find(function(a){return a.id===fa;})||{}).label : '';
    freeHtml = '<div class="sec2">'+(areaNm?esc(areaNm)+'で':'')
      + 'シフトは出ているが、まだ入っていない人 '+free.length+'名</div>'
      + '<div class="freerow">'+free.map(function(s){
          const k = kindAt(s, DAY);
          return '<span class="fchip">'+esc(s.disp)
               + (k==='研修'?'<i>研修</i>':'')
               + (s.move?'<u>'+esc(s.move)+'</u>':'')+'</span>'; }).join('')+'</div>';
  }

  const nBad = needStaff.length, nChk = needChk.length;
  const holDay = holName(DAY);                                 // ★v7.78
  const head = '<div class="dayhd'+(isRedDay(DAY)?' red':'')+'">'
    + esc(fmtMD(DAY))+'('+esc(WD[new Date(DAY+'T00:00:00').getDay()])+')'
    + (holDay?'<span class="hol">'+esc(holDay)+'</span>':'')
    + (DAY===DATA.today?'<span class="today">本日</span>':'')
    + '<small>'+clean.length+'件'
    + (nBad?'　🔴'+nBad:'')+(nChk?'　🟡'+nChk:'')+'</small></div>';

  $('body').innerHTML = strip + head + tray
    + (body || '<div class="center">この日はまだ誰も入っていません。</div>') + freeHtml;
}


// ★v7.36 提出シフトは「何日ぶん出したか」ではなく【いつ出しているか】を出す。
//   件数だけでは、その日に頼めるかどうか分からない。
const WD = ['日','月','火','水','木','金','土'];
function shiftHtml(shift, nDays){
  const days = Object.keys(shift||{}).sort();
  if(!days.length) return '<span style="color:#a06a00;font-weight:700">未提出</span>';
  // ★v7.38 サーバー側で ○ / × に正規化済み。生値（true など）は流れてこない
  const ok = days.filter(function(d){ return shift[d] !== '×'; });
  const chips = days.map(function(d){
    const w   = new Date(d+'T00:00:00').getDay();
    const cls = (w===0) ? ' class="sun"' : (w===6 ? ' class="sat"' : '');
    const bad = (shift[d] === '×');
    const lbl = fmtMD(d);          // ★v7.42 曜日なし・0詰めなし
    return '<span'+(bad?' style="color:#aaa;text-decoration:line-through"':cls)+'>'+esc(lbl)+'</span>';
  }).join('');
  return '<span style="color:#666;font-size:12px">'+ok.length+'日 / '+nDays+'日</span>'
       + '<div class="days">'+chips+'</div>';
}

// ---- スタッフ ----
function drawStaff(){
  const st = DATA.staff || [];
  if(!st.length){ $('body').innerHTML='<div class="center">対象のスタッフがいません。</div>'; return; }
  // ★★v8.29 対応可物件がIDのまま出ていた（あなたの指摘 2026-08-30）。
  //   DATA.props は【表示期間内に予定がある物件】だけなので、
  //   予約の無い物件は名前を引けず L1004 のまま出ていた。
  //   DATA.propNames（AssignBoard v8.29）は、スタッフの対応可物件に出てくるIDの名前。
  //   ⚠️ 順番はこの通り。props（清掃ジョブの物件名）を後に置いて、実際に使われている表記を優先する。
  const propName = Object.assign({}, DATA.propNames||{});
  (DATA.props||[]).forEach(function(p){ propName[p.pid]=p.name; });

  const nDays = (function(){
    const a=new Date(DATA.from+'T00:00:00'), b=new Date(DATA.to+'T00:00:00');
    return Math.round((b-a)/86400000)+1;
  })();

  // ★v7.36 稼働していない人はサーバー側で外してあるので、ここは全員が稼働中
  let h = '<div class="sum">'
    + '<div><b>'+st.length+'</b><span>稼働中</span></div>'
    + '<div class="warn"><b>'+st.filter(function(x){return x.kind==='研修';}).length+'</b><span>研修中</span></div>'
    + '<div class="bad"><b>'+st.filter(function(x){return !x.move;}).length+'</b><span>移動手段 未設定</span></div>'
    + '<div class="warn"><b>'+st.filter(function(x){return x.kind==='研修'&&(x.done||0)>=3;}).length+'</b><span>独り立ち判断</span></div>'
    + '</div>';

  const sortFn = function(a,b){
    if(a.active !== b.active) return a.active ? -1 : 1;
    const ar = (a.kind==='研修') ? 0 : 1, br = (b.kind==='研修') ? 0 : 1;
    if(ar !== br) return ar - br;                       // 研修中を先頭に（判断が要る人）
    if(ar===0) return (b.done||0) - (a.done||0);        // 研修中は実績の多い順
    return a.disp < b.disp ? -1 : 1;
  };

  // ★v7.35 エリアごとに分ける。両エリア担当の人は【どちらにも】出す。
  //   （近藤さんのように湘南と横須賀を兼ねる人がいるため、片方に寄せると探せなくなる）
  const labels = DATA.areaLabels || {};
  const areaIds = Object.keys(labels);
  const fa2 = $('f-area').value;                  // ★v7.51 スタッフもエリアで絞る
  const areaIds2 = fa2 ? areaIds.filter(function(a){ return a===fa2; }) : areaIds;
  const groups = areaIds2.length ? areaIds2.map(function(aid){
    return { id:aid, label: labels[aid]||aid,
             list: st.filter(function(s){ return (s.areas||[]).indexOf(aid) >= 0; }).sort(sortFn) };
  }).filter(function(g){ return g.list.length; }) : [{ id:'', label:'', list: st.slice().sort(sortFn) }];

  const cardHtml = function(s){
    const shiftN = Object.keys(s.shift||{}).length;
    const doneN = s.done || 0;
    // ★行頭の + で三項演算子を繋ぐと構文エラーになる。先に組み立てる
    let trainRow = '';
    if(s.kind === '研修'){
      const col = (doneN >= 3) ? 'color:#2e7d32' : 'color:#a06a00';
      trainRow = '<span class="k">実績</span><span>'
        + '<b style="font-size:15px;'+col+'">'+doneN+'回</b>'
        + (s.doneCheck ? ' <span style="color:#666;font-size:12px">＋チェック'+s.doneCheck+'回</span>' : '')
        + (s.lastDone  ? ' <span style="color:#666;font-size:12px">最終 '+esc(fmtMD(s.lastDone))+'</span>' : '')
        + (doneN >= 3  ? ' <span class="badge so">独り立ち判断</span>' : '')
        + '</span>';
    }
    const kb = s.kind==='研修'     ? '<span class="badge tr">研修中</span>'
             : s.kind==='独り立ち' ? '<span class="badge so">独り立ち</span>'
             : s.kind==='稼働前'   ? '<span class="badge ng">稼働前</span>'
             : '<span class="badge ng">区分未設定</span>';

    // ★v7.35 研修中なのに「独り立ち日」が未来＝まだ研修、という状態を見えるようにする。
    //   日付を入れたのに反映されていないように見えるのは、たいていこれ。
    let soloRow = '';
    if(s.kind==='研修' && s.soloFrom){
      soloRow = '<span class="k">独り立ち予定</span><span>'+esc(s.soloFrom)
              + ' <span class="t">（この日から時給が変わります）</span></span>';
    }else if(s.kind==='研修'){
      soloRow = '<span class="k">独り立ち予定</span>'
              + '<span><span style="color:#a06a00;font-weight:700">未設定</span>'
              + ' <span class="t">スタッフマスタ P列「独り立ち日」</span></span>';
    }

    // ★v7.35 稼働回数は勤怠ログから毎回その場で数えた最新値
    const workRow = '<span class="k">稼働回数</span><span>'
      + '<b>'+(s.mDone||0)+'回</b> <span class="t">今月</span>'
      + ' <span style="color:#666;font-size:12px">/ 累計 '+(s.tDone||0)+'回</span>'
      + '</span>';

    const props = s.propsAll ? 'エリア内すべて'
                : (s.props.length
                    ? s.props.map(function(p){ return esc(propName[p]||p); }).join('・')
                    : '<span style="color:#c62828;font-weight:700">なし</span>');
    return '<div class="st'+(s.active?'':' off')+'">'
      +   '<div class="n">'+esc(s.disp)+kb+(s.active?'':'<span class="badge ng">稼働停止</span>')+'</div>'
      +   '<div class="rows">'
      +     trainRow
      +     soloRow
      +     workRow
      +     '<span class="k">対応可物件</span><span>'+props+'</span>'
      +     '<span class="k">移動手段</span><span>'
      +        (s.move ? esc(s.move) : '<span style="color:#c62828;font-weight:700">未設定</span>')
      +     '</span>'
      +     '<span class="k">提出シフト</span><span>'+shiftHtml(s.shift, nDays)+'</span>'
      +   '</div>'
      + '</div>';
  };

  groups.forEach(function(g){
    if(g.label) h += '<div class="area">【'+esc(g.label)+'】<span class="cnt">'+g.list.length+'名</span></div>';
    h += g.list.map(cardHtml).join('');
  });
  $('body').innerHTML = h;
}


// ============================================================
// ★v7.45【段2】担当を決めて保存する
//   できること: 清掃担当 / 募集人数 / チェック担当 だけ。
//   ⚠️ 時刻・清掃日は触りません（段3・段4）。
//   保存の可否・整合はすべてサーバー側（AssignApply.gs）が判定します。
//   画面は「選ばせて送るだけ」。ここで判定を二重に持つと必ずズレます。
// ============================================================
const OUTSIDE = ['外注','オーナー'];
let ED = null;      // 編集中の状態
let DAY = '';       // ★v7.50 いま見ている日
function pickDay(d){ DAY = d; draw(); window.scrollTo(0,0); }

function findJob(jobKey){
  let hit = null;
  (DATA.areas||[]).forEach(function(a){
    a.jobs.forEach(function(j){ if(j.kind!=='check' && j.jobKey===jobKey && !hit) hit = j; });
  });
  return hit;
}

// ★v7.71【4つに分ける】社長指摘 2026-08-27
//   「シフトを提出していない人にも“この日は空いています”と出ると勘違いしやすい」
//   空いている＝頼める、ではない。シフトが出ていない人は
//   【その日入れるかどうかが分からない】だけで、空いているわけではない。
//
//     ① シフトあり × 予定なし … いちばん頼みやすい
//     ② シフトあり × 予定あり … 移動が間に合えば追加で頼める
//     ③ シフトなし × 予定あり … すでに出勤している日。頼める可能性が高い
//     ④ シフトなし × 予定なし … 入れるか分からない。声かけが要る
function pickable(j){
  // ★v7.76【対応可物件が空＝エリア内すべて】社長指摘 2026-08-27
  //   対応可物件が空欄の人は「エリア内すべて」の意味であって「全国どこでも」ではない。
  //   エリアを見ずに通していたので、逗子の人が湘南の物件の候補に出ていた。
  //   声をかけてから「その物件は対応していません」と分かる＝手戻り。
  const jArea = ((DATA.props||[]).find(function(p){ return p.pid===j.pid; })||{}).area || '';
  const okProp = function(s){
    if(!s.propsAll) return (s.props||[]).indexOf(j.pid) >= 0;   // 物件を挙げている人はそれで判断
    return !jArea || (s.areas||[]).indexOf(jArea) >= 0;         // 空欄の人は担当エリアで判断
  };
  const day = ED ? ED.date : j.ymd;
  const g = { shiftFree: [], shiftBusy: [], noShiftBusy: [], noShiftFree: [] };
  (DATA.staff||[]).forEach(function(s){
    if(!okProp(s)) return;
    const mk = (s.shift||{})[day];
    const hasShift = !!(mk && mk !== '×');
    const busy = hasJobsOn(s, day, j.jobKey);
    if(hasShift) (busy ? g.shiftBusy : g.shiftFree).push(s);
    else         (busy ? g.noShiftBusy : g.noShiftFree).push(s);
  });
  const by = function(a,b){ return a.disp < b.disp ? -1 : 1; };
  Object.keys(g).forEach(function(k){ g[k].sort(by); });
  return g;
}

// その日、他に予定を持っているか
function hasJobsOn(s, day, exceptKey){
  let hit = false;
  (DATA.areas||[]).forEach(function(a){
    a.jobs.forEach(function(x){
      if(hit || x.kind==='check' || x.ymd!==day || x.jobKey===exceptKey) return;
      if((x.staff||[]).indexOf(s.disp)>=0 || (x.staff||[]).indexOf(s.name)>=0) hit = true;
    });
  });
  return hit;
}

function kindAt(s, ymd){
  const tf = s.trainFrom||'', sf = s.soloFrom||'';
  if(!tf && !sf) return '';
  if(tf && ymd < tf) return '稼働前';
  return (sf && ymd >= sf) ? '独り立ち' : '研修';
}

// ★v7.81【チェックのカードを開いたら、チェックの画面を出す】社長指摘 2026-08-27
//   「チェック担当のカードを開いたのに、現在の清掃担当や清掃担当の変更もできるようになっており、
//     チェック担当が下部にあったので勘違いしました」
//
//   チェックのカードから開いても、中身は清掃の編集画面そのものだった。
//   一番上に清掃担当がずらりと並び、チェック担当はスクロールしないと出てこない。
//   見間違えるだけでなく、チェックを直しに来て清掃担当を触ってしまう事故になる。
//   → チェックから開いたときは、清掃のブロックをたたんで要約だけにし、
//     チェックの欄をすぐ触れる位置に出す。清掃を直したいときは自分で開く。
function openEdit(jobKey, fromCheck){
  const j = findJob(jobKey);
  if(!j) return;
  ED = { j: j,
         focus: fromCheck ? 'check' : 'clean',   // ★v7.81
         openClean: !fromCheck,                  // 清掃のブロックを開いているか
         staff: (j.staff||[]).slice(),
         chk:   (j.chk||[]).slice(),
         need:  String(j.need||''),
         start: j.start||'', end: j.end||'',      // ★v7.55 段3
         date:  j.ymd,                            // ★v7.55 段4
         memo:  '',                               // 縮めた理由
         note:  '',                               // ★v7.56 依頼するときの特記事項
         chkDate: j.chkDate||'', chkTime: j.chkTime||'',   // ★v7.57
         busy:  false, err: '' };
  drawEdit();
  $('ovl').classList.add('on');
}
function closeEdit(){ $('ovl').classList.remove('on'); ED = null; }
function toggleClean(){ if(ED){ ED.openClean = !ED.openClean; drawEdit(); } }

function togStaff(n){
  // ★v7.79 清掃担当に入れたら、チェック担当からは外す（同一人物にしない）
  if(ED.staff.indexOf(n) < 0){
    const i = ED.chk.indexOf(n);
    if(i >= 0) ED.chk.splice(i, 1);
  }
  tog(ED.staff, n); drawEdit();
}
function togChk(n){
  tog(ED.chk, n);
  // ★v7.57 チェック担当を決めたら、日と時刻に既定を入れておく（空のまま保存されると意味がない）
  if(ED.chk.length){
    if(!ED.chkDate) ED.chkDate = ED.date;
    if(!ED.chkTime) ED.chkTime = ED.end || '16:00';
  }
  drawEdit();
}
function tog(arr, n){ const i = arr.indexOf(n); if(i>=0) arr.splice(i,1); else arr.push(n); }
// ★v7.55 時刻の増減。30分きざみ。既存の値は丸めない（10:21 のような値がある）
function hm2min(t){ const m=String(t||'').match(/^(\d{1,2}):(\d{1,2})$/); return m ? (+m[1])*60+(+m[2]) : null; }
function min2hm(n){ n=Math.max(0,Math.min(47*60+59,n)); return Math.floor(n/60)+':'+('0'+(n%60)).slice(-2); }
function bumpStart(d){
  const s0 = hm2min(ED.start), e0 = hm2min(ED.end);
  if(s0==null) return;
  const span = (e0!=null) ? e0-s0 : null;
  ED.start = min2hm(s0 + d*30);
  if(span!=null) ED.end = min2hm(hm2min(ED.start) + span);   // 所要はそのままで前後に動かす
  drawEdit();
}
function bumpSpan(d){
  const s0 = hm2min(ED.start), e0 = hm2min(ED.end);
  if(s0==null || e0==null) return;
  const n = Math.max(30, (e0-s0) + d*30);
  ED.end = min2hm(s0 + n);
  drawEdit();
}
function setSpan(n){
  const s0 = hm2min(ED.start); if(s0==null) return;
  ED.end = min2hm(s0 + n); drawEdit();
}
function setDate(d){ ED.date = d; drawEdit(); }
// ★v7.57 チェック対応日・時刻
function setChkDate(d){ ED.chkDate = d; if(!ED.chkTime) ED.chkTime = ED.end || '16:00'; drawEdit(); }
function bumpChkTime(d){
  let n = hm2min(ED.chkTime);
  if(n==null) n = hm2min(ED.end) || 16*60;
  ED.chkTime = min2hm(n + d*30);
  if(!ED.chkDate) ED.chkDate = ED.date;
  drawEdit();
}
function setMemo(m){ ED.memo = (ED.memo===m ? '' : m); drawEdit(); }
function setNote(v){ ED.note = String(v||'').slice(0,200); }   // 入力のたびに描き直さない（カーソルが飛ぶ）
// 標準清掃時間「3時間」「2.5時間」「180分」→ 分
function stdMin(std){
  const s = String(std||'');
  let m = s.match(/([\d.]+)\s*時間/); if(m) return Math.round(parseFloat(m[1])*60);
  m = s.match(/([\d.]+)\s*分/);       if(m) return Math.round(parseFloat(m[1]));
  return null;
}
// 清掃日として選べる範囲: チェックアウト日 〜 次回IN
function dateRange(j){
  const from = j.outD || j.ymd, to = j.nextIn || '';
  const out = [];
  let d = new Date((from<j.ymd?from:j.ymd)+'T00:00:00');
  const end = to ? new Date(to+'T00:00:00') : new Date(new Date(j.ymd+'T00:00:00').getTime()+3*86400000);
  for(let i=0;i<14 && d<=end;i++){
    const y = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    out.push(y); d = new Date(d.getTime()+86400000);
  }
  return out;
}

function bumpNeed(d){
  let n = parseInt(ED.need,10); if(!isFinite(n)) n = 0;
  n += d; if(n < 0) n = 0; if(n > 9) n = 9;
  ED.need = n ? String(n) : '';
  drawEdit();
}

function pillHtml(label, on, fn, sub, cls){
  return '<button class="pill'+(on?' on':'')+(cls?' '+cls:'')+'" onclick="'+fn+'">'+esc(label)
       + (sub ? '<i>'+esc(sub)+'</i>' : '')+'</button>';
}

// ★v7.64 その人がその日すでに持っている予定と、この現場へ間に合うかを返す。
//   { txt, ng }  ng=true なら赤く出す（間に合わない・重なっている）
function candStatus(s, j){
  const day = ED.date;
  // その人のその日の予定（この案件は除く）
  const mine = [];
  (DATA.areas||[]).forEach(function(a){
    a.jobs.forEach(function(x){
      if(x.kind==='check') return;
      if(x.ymd !== day) return;
      if(x.jobKey === j.jobKey) return;
      if((x.staff||[]).indexOf(s.disp) < 0 && (x.staff||[]).indexOf(s.name) < 0) return;
      mine.push(x);
    });
  });
  if(!mine.length){
    const mk = (s.shift||{})[day];
    // ★v7.71 シフトが出ていない人を「空いています」と言わない
    return (mk && mk !== '×')
      ? { txt: '✅ シフト提出あり・他の予定なし', ng: false, n: 0 }
      : { txt: 'シフト未提出。この日入れるかは分かりません', ng: false, ask: true, n: 0 };
  }

  mine.sort(function(a,b){ return (a.start||'99:99') < (b.start||'99:99') ? -1 : 1; });
  const list = mine.map(function(x){
    return (x.start||'--:--')+'〜'+(x.end||'')+' '+x.prop;
  }).join('　/　');

  // この案件を挟んだ前後との移動が足りるか
  const s0 = hm2min(ED.start), e0 = hm2min(ED.end);
  let ng = false, why = [];
  mine.forEach(function(x){
    const xs = hm2min(x.start), xe = hm2min(x.end);
    if(s0==null || xs==null) return;
    if(xe!=null && e0!=null && xs < e0 && s0 < xe){ ng = true; why.push('時間が重なります'); return; }
    if(xe!=null && xe <= s0){                       // 相手が先 → こちらへ移動
      const mn = travelMin(x.pid, j.pid, s.move);
      const gap = s0 - xe;
      if(mn==null){ why.push(x.prop+' のあと '+gap+'分（移動時間 不明）'); }
      else if(gap < mn){ ng = true; why.push(x.prop+' から '+mn+'分かかります（空き'+gap+'分）'); }
      else { why.push(x.prop+' のあと 移動'+mn+'分 → 空き'+gap+'分 ✅'); }
    }else if(e0!=null && e0 <= xs){                 // こちらが先 → 相手へ移動
      const mn = travelMin(j.pid, x.pid, s.move);
      const gap = xs - e0;
      if(mn==null){ why.push('このあと '+x.prop+' まで '+gap+'分（移動時間 不明）'); }
      else if(gap < mn){ ng = true; why.push('このあと '+x.prop+' まで '+mn+'分かかります（空き'+gap+'分）'); }
      else { why.push('このあと '+x.prop+' へ 移動'+mn+'分 → 空き'+gap+'分 ✅'); }
    }
  });
  // ★v7.76 バッジに「どこにアサイン済みか」を出すため、最初の予定を返す
  return { txt: list + (why.length ? '\n' + why.join('\n') : ''), ng: ng, n: mine.length,
           first: { prop: mine[0].prop, start: mine[0].start || '', end: mine[0].end || '' } };
}

// ★v7.72【ピルに載せる短いバッジ】社長指摘 2026-08-27
//   「1人1行よりもバッジの方が見やすかった」
//   1行ずつ出すと、候補が20人いれば20行スクロールしないと選べない。
//   ピルは一目で全員が見えるが、そのままだと予定の有無が消えてしまう。
//   → ピルは残し、判断に要る最小限（回れない／他に予定／シフト未提出）だけをバッジで出す。
//     中身（何時にどこ・移動何分）は、選んだ人の分だけ下に出す。
function candBadge(s, j){
  const st = candStatus(s, j);
  // ★v7.73 すでに依頼を出している人は、返事の状況を最優先で出す。
  //   「名前が入っている＝決まり」ではないことを、選ぶ画面でも分かるようにする。
  const of = offerOf(j, s.disp);
  if(of === 'wait') return { sub: (isOver(j)?'⏳期限切れ':'⏳返事待ち'), ng: false, ask: false, wait: true, st: st };
  if(of === 'ok')   return { sub: '✅承諾', ng: false, ask: false, st: st };
  if(of === 'ng')   return { sub: '✕辞退', ng: true,  ask: false, st: st };

  // ★v7.76【出勤している＝回れない、ではない】社長指摘 2026-08-27
  //   旧: その日ほかに予定があって移動が足りないと「✕回れない」と赤で出していた。
  //       これは画面が勝手に「無理だ」と決めつけている。
  //       実際は、順番を入れ替える・時間をずらす・途中合流するなど手はある。
  //   新: どこにアサイン済みかを名前で出す（「Umito 10:00〜」）。
  //       重なり・移動不足は【要確認】として橙で出すが、赤で止めない。
  //       選べば、シフト提出組と同じように本人へ確認の通知が飛ぶ。
  if(st.n){
    const lab = st.first
      ? (st.first.prop + (st.first.start ? ' ' + st.first.start + '〜' : ''))
      : ('他' + st.n + '件');
    const more = (st.n > 1) ? ' 他' + (st.n - 1) + '件' : '';
    return { sub: lab + more, ng: false, ask: false, warn: !!st.ng, st: st };
  }
  // ★v7.77 「？未提出」は全員に付いて、研修・稼働前のバッジが埋もれる（社長指摘 2026-08-27）。
  //   シフト未提出はグループの見出しで分かるので、ピルには出さない。
  return { sub: '', ng: false, ask: !!st.ask, st: st };
}


// ============================================================
// ★v7.77【回る順番をドラッグで入れ替える】社長指摘 2026-08-27
//   「ドラッグで順番を変えられたりできるイメージじゃなかったですか？」
//
//   管理者は「誰を入れるか」より先に「どう回るか」を考える。
//   1件ずつ開いて時刻を打ち直すのではなく、順番を入れ替えたら
//   前の現場の終わり＋移動時間から、後ろの時刻が全部ついてくるようにする。
//
//   【動かすもの】清掃の開始・終了時刻だけ。
//   【動かさないもの】担当・清掃日・チェック。順番の話に混ぜない。
//   ⚠️ 所要時間（終了−開始）は各現場そのまま持ち回る。勝手に短くしない。
//   ⚠️ 2名以上の現場は、相手の予定も動く。赤で警告してから保存させる。
// ============================================================
var ROD = null;   // { nm, move, list:[{j,dur,origStart,origEnd}], drag:{...} }

function startReorder(nm){
  var s = staffOf(nm);
  var stops = (lanesOf(DAY)[nm]||[]).filter(function(x){ return x.kind==='清掃'; });
  if(stops.length < 2){
    $('msg').className='msg'; $('msg').textContent='この日は1件だけなので、並べ替えるものがありません。';
    setTimeout(function(){ $('msg').textContent=''; }, 2600); return;
  }
  ROD = { nm: nm, move: s ? s.move : '', drag: null, tight: false,
    list: stops.map(function(x){
      var a = hm2min(x.j.start), b = hm2min(x.j.end);
      return { j: x.j, dur: (a!=null&&b!=null&&b>a) ? (b-a) : (stdMin(x.j.std)||120),
               origStart: x.j.start||'', origEnd: x.j.end||'' };
    }) };
  drawReorder();
  $('rovl').classList.add('on');
}
function closeReorder(){ $('rovl').classList.remove('on'); ROD = null; }
function rodTight(){ if(ROD){ ROD.tight = !ROD.tight; drawReorder(); } }

/**
 * 並べた順に時刻を組み直す。
 * ★v7.77【勝手に前倒ししない】
 *   単純に「前の終わり＋移動」で詰めると、順番を変えていないのに
 *   14:00 の予定が 13:20 に繰り上がってしまう。
 *   管理者がわざと空けた間（次のチェックアウト待ち・昼休憩など）を
 *   画面が黙って潰すことになる。
 *   → もとの開始時刻より早くはしない（max をとる）。
 *      並べ替えていなければ、1件も変わらない。
 *   → 先頭だけは、その日のいちばん早い開始に合わせる
 *      （後ろにあった現場を先頭に持ってきたとき、17時のまま動かないと意味がない）。
 *   ROD.tight = true のときだけ、もとの時刻を無視してぴったり詰める。
 */
function rodPlan(){
  var out = [];
  var base = null;
  ROD.list.forEach(function(x){
    var v = hm2min(x.origStart);
    if(v != null && (base == null || v < base)) base = v;
  });
  if(base == null) base = 9*60;

  var t = base;
  ROD.list.forEach(function(x, i){
    var mv = 0, unknown = false;
    if(i > 0){
      var prev = ROD.list[i-1];
      var m = (prev.j.pid === x.j.pid) ? 0 : travelMin(prev.j.pid, x.j.pid, ROD.move);
      if(m == null){ unknown = true; m = 0; }
      mv = m;
      t = t + mv;
      if(t % 5) t += (5 - t % 5);            // 5分きざみに切り上げ
    }
    if(!ROD.tight && i > 0){
      var orig = hm2min(x.origStart);        // もとより早くはしない
      if(orig != null && orig > t) t = orig;
    }
    var over = (t + x.dur) > (23*60 + 59);   // 日をまたぐ＝組めていない
    out.push({ x: x, start: min2hm(t), end: min2hm(t + x.dur),
               mv: mv, unknown: unknown, over: over });
    t = t + x.dur;
  });
  return out;
}

function drawReorder(){
  var plan = rodPlan();
  var rows = plan.map(function(p, i){
    var x = p.x, j = x.j;
    var moved = (p.start !== x.origStart) || (p.end !== x.origEnd);
    var multi = (j.staff||[]).filter(function(n){ return OUTSIDE.indexOf(n)<0; }).length > 1;
    var hop = '';
    if(i > 0){
      hop = '<div class="rhop'+(p.unknown?' ng':'')+'">'
          + (p.mv===0 && !p.unknown ? '　同じ物件（移動なし）'
             : (p.unknown ? '　'+moveIcon(ROD.move)+' 移動時間が分かりません（0分で計算しています）'
                          : '　'+moveIcon(ROD.move)+' 移動 '+p.mv+'分'))+'</div>';
    }
    var late = j.nextIn===j.ymd && j.inT && hm2min(p.end)!=null && hm2min(j.inT)!=null
               && hm2min(p.end) > hm2min(j.inT);
    var over = p.over;
    return hop
      + '<div class="rrow'+(moved?' moved':'')+'" data-i="'+i+'">'
      +   '<div class="gr" onpointerdown="rodGrab(event,'+i+')">≡</div>'
      +   '<div class="in"><div class="p">'+esc(j.prop)+'</div>'
      +     '<div class="t">'+(moved?'<s>'+esc(x.origStart||'--:--')+'〜'+esc(x.origEnd||'--:--')+'</s> → ':'')
      +       '<b>'+esc(p.start)+'〜'+esc(p.end)+'</b>'
      +       '　<span style="color:#999">'+Math.floor(x.dur/60)+'時間'+(x.dur%60?(x.dur%60)+'分':'')+'</span></div>'
      +     (j.staff&&j.staff.length ? '<div class="t" style="color:#8a8f96">'+esc(j.staff.join('・'))+'</div>' : '')
      +     (multi ? '<div class="w">⚠️ 2名以上の現場です。相手の予定も動きます</div>' : '')
      +     (late  ? '<div class="w">🔴 次回IN '+esc(j.inT)+' に間に合いません</div>' : '')

// ---- ドラッグ（指でもマウスでも動くよう pointer で書く）----
function rodGrab(ev, i){
  ev.preventDefault();
  var sheet = $('rsheet');
  var row = sheet.querySelector('.rrow[data-i="'+i+'"]');
  if(!row) return;
  var r = row.getBoundingClientRect();
  var ghost = row.cloneNode(true);
  ghost.className = 'rrow rghost';
  ghost.style.width = r.width+'px';
  ghost.style.left = r.left+'px';
  ghost.style.top = r.top+'px';
  document.body.appendChild(ghost);
  row.classList.add('drag');
  ROD.drag = { i: i, dy: ev.clientY - r.top, ghost: ghost, row: row };
  try { ev.target.setPointerCapture(ev.pointerId); } catch(e){}
  ev.target.onpointermove = rodMove;
  ev.target.onpointerup = rodDrop;
  ev.target.onpointercancel = rodDrop;
}
function rodMove(ev){
  if(!ROD || !ROD.drag) return;
  ev.preventDefault();
  var d = ROD.drag;
  d.ghost.style.top = (ev.clientY - d.dy)+'px';
  // どの位置に入るか：各行の中心とくらべる
  var rows = [].slice.call($('rsheet').querySelectorAll('.rrow:not(.rghost)'));
  var to = d.i;
  for(var k=0;k<rows.length;k++){
    var rr = rows[k].getBoundingClientRect();
    if(ev.clientY < rr.top + rr.height/2){ to = k; break; }
    to = k;
  }
  if(to !== d.i){
    var it = ROD.list.splice(d.i, 1)[0];
    ROD.list.splice(to, 0, it);
    d.i = to;
    drawReorder();
    // 描き直したので、掴んでいる行に印を付け直す
    var nr = $('rsheet').querySelector('.rrow[data-i="'+to+'"]');
    if(nr){ nr.classList.add('drag'); d.row = nr; }
  }
}
function rodDrop(ev){
  if(!ROD || !ROD.drag) return;
  var d = ROD.drag;
  try { d.ghost.parentNode.removeChild(d.ghost); } catch(e){}
  try { ev.target.onpointermove = null; ev.target.onpointerup = null; ev.target.onpointercancel = null; } catch(e){}
  ROD.drag = null;
  drawReorder();
}

function saveReorder(){
  if(!ROD) return;
  var plan = rodPlan();
  var items = plan.filter(function(p){
    return p.start !== p.x.origStart || p.end !== p.x.origEnd;
  }).map(function(p){
    return { row: p.x.j.row, jobKey: p.x.j.jobKey,
             ver: (p.x.j.ver==null?'':String(p.x.j.ver)),
             start: p.start, end: p.end };
  });
  if(!items.length) return;
  if(plan.some(function(p){ return p.over; })){
    alertBox('この順番では、その日のうちに終わりません。順番を見直してください。'); return;
  }
  try { var sb = $('rod-save'); if(sb){ sb.disabled = true; sb.textContent = '保存しています…'; } } catch(e){}

  jsonp(GAS_URL+'?mode=ab_apply&userId='+encodeURIComponent(me.userId)
        +'&payload='+encodeURIComponent(JSON.stringify({ items: items })))
  .then(function(res){
    if(res && res.ok){
      closeReorder();
      $('msg').className='msg';
      $('msg').textContent = res.message || (items.length+'件の時刻を組み直しました。');
      reload(); return;
    }
    var m = (res && res.message) || '保存できませんでした。';
    if(res && res.ng && res.ng.length) m += '\n' + res.ng.map(function(x){ return '・'+x.prop+'：'+x.why; }).join('\n');
    alertBox(m); drawReorder();
  })
  .catch(function(err){ alertBox('通信できませんでした。\n('+err.message+')'); drawReorder(); });
}
function alertBox(m){
  $('msg').className='msg ng'; $('msg').textContent=m;
  setTimeout(function(){ $('msg').textContent=''; $('msg').className='msg'; }, 6000);
}

function drawEdit(){
  // ★v7.56 描き直す前に、入力中の特記事項を拾っておく
  try { const t = document.getElementById('ed-note'); if(t) ED.note = t.value; } catch(e){}
  const j = ED.j, P = pickable(j);
  // ★v7.79【チェック担当にできるのは「独り立ちが確認できる人」だけ】社長指摘 2026-08-27
  //   「アサインされている研修中の山口さんがチェックのアサインに出現して選択できる」
  //
  //   原因は kindAt の空欄あつかい。研修開始日も独り立ち日も未登録だと '' が返り、
  //   「研修ではない」＝チェックできる、と通していた。
  //   ⚠️ 空欄は「ベテラン」ではなく「分からない」。分からない人に検品は任せられない。
  //   → 研修・稼働前・未登録は、すべてチェック担当から外す（安全側に倒す）。
  //     ただし黙って消すとマスタが直らないので、誰が未登録なのかを画面に出す。
  //   ⚠️ 判定する日は【チェックをする日】。清掃日ではない
  //     （8/30清掃・8/31チェックで、8/31に独り立ちする人がいる）。
  const chkDay = ED.chkDate || ED.date;
  // ★v7.80【列が読めていないときは厳しく判定しない】
  //   スタッフマスタの見出しがずれていると、全員が「日付未登録」に見える。
  //   そのまま弾くとチェック担当を1人も選べず、手配が完全に止まる。
  //   1人でも日付が読めていれば「列は合っている」とみなす。0人なら緩める。
  const datesOk = (DATA.staff||[]).some(function(x){ return x.trainFrom || x.soloFrom; });
  const canCheck = function(s){
    const k = kindAt(s, chkDay);
    if(k === '研修' || k === '稼働前') return false;      // ここは常に外す
    if(k === '独り立ち') return true;
    return !datesOk;                                      // '' は、列が読めていないときだけ通す
  };
  const noDates  = function(s){ return datesOk && kindAt(s, chkDay) === ''; };
  const isTrainee = function(s){ return kindAt(s, j.ymd) === '研修'; };
  const q = function(x){ return "'"+String(x).replace(/'/g,"\\'")+"'"; };

  // ★v7.72 候補はピル＋バッジ。回れない人は後ろへ回す（消さない・自分で判断できるように）
  const staffCands = function(list){
    const withSt = list.map(function(s){ return { s: s, b: candBadge(s, j) }; });
    withSt.sort(function(a,b){
      const aw = (a.b.ng||a.b.warn)?1:0, bw = (b.b.ng||b.b.warn)?1:0;
      if(aw !== bw) return aw - bw;                         // 要確認・辞退は下
      if(a.b.st.n !== b.b.st.n) return a.b.st.n - b.b.st.n; // 予定が少ない人が上
      return a.s.disp < b.s.disp ? -1 : 1;
    });
    return withSt.map(function(w){
      const s = w.s, b = w.b;
      const k = kindAt(s, j.ymd);
      const on = ED.staff.indexOf(s.disp) >= 0;
      return '<button class="pill'+(on?' on':'')+(b.ng?' ng':'')+(b.ask?' ask':'')+(b.wait?' wait':'')
           + (b.warn?' warn':'')
           + '" onclick="togStaff('+q(s.disp)+')">'+esc(s.disp)
           + (k==='研修'?'<i>研修</i>':(k==='稼働前'?'<i>稼働前</i>':''))
           + (b.sub ? '<i class="b">'+esc(b.sub)+'</i>' : '')
           + '</button>';
    }).join('');
  };
  // ★v7.72 選んだ人の分だけ、その日の予定と移動時間を出す（全員分を出すと長すぎる）
  // ★v7.76 選んだ人に加えて【要確認】の人も出す。
  //   赤で止めるのをやめた以上、なぜ要確認なのかが見えないと判断できない。
  const chosenDetail = (function(){
    const seen2 = {}, out2 = [];
    const add2 = function(s){
      if(!s || seen2[s.disp]) return;
      const st = candStatus(s, j);
      if(!st.n) return;                          // その日ほかに予定が無い人は出さない
      seen2[s.disp] = 1;
      out2.push('<div class="cd'+(st.ng?' ng':'')+'"><b>'+esc(s.disp)

      g.forEach(function(s){ if(candStatus(s, j).ng) add2(s); });

  // チェック担当は独り立ちのみ（研修中は見る側になれない）

  // マスタが未登録で候補から外れた人（誰を直せばよいか出す）

  // ★v7.56 今回あらたに依頼することになる人（外注・オーナーは除く）

  const nowN = ED.staff.length;

  // ★v7.57 チェック欄を出すかどうか
