<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>清掃希望を送信</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --green:#2e7d32; --green-l:#e8f5e9; --ink:#222; --sub:#666; --bg:#f7f8f7; --line:#e0e0e0; --off:#fff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
  .wrap{ max-width:480px; margin:0 auto; padding:12px 14px 120px; }
  .hello{ font-size:16px; font-weight:700; margin:6px 2px 2px; }
  .lead{ font-size:13px; color:var(--sub); margin:0 2px 14px; line-height:1.6; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 12px; margin-bottom:14px; }
  .monthTitle{ font-size:15px; font-weight:700; margin:4px 2px 10px; }
  .dow{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  .dow span{ text-align:center; font-size:11px; color:var(--sub); padding:2px 0; }
  .dow span.sat{ color:#1565c0; }
  .dow span.sun{ color:#c62828; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cell{ aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    font-size:14px; border-radius:9px; border:1px solid var(--line); background:var(--off);
    color:var(--ink); cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .cell.empty{ border:none; background:transparent; cursor:default; }
  .cell.past{ color:#ccc; background:#fafafa; border-color:#f0f0f0; cursor:default; }
  .cell.on{ background:var(--green); color:#fff; border-color:var(--green); font-weight:700; }
  .cell.sat{ color:#1565c0; }
  .cell.sun{ color:#c62828; }
  .cell.on.sat, .cell.on.sun{ color:#fff; }
  .bar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); max-width:480px; margin:0 auto; }
  .count{ font-size:13px; color:var(--sub); margin-bottom:6px; text-align:center; }
  .count b{ color:var(--green); font-size:15px; }
  .btn{ display:block; width:100%; padding:14px; background:var(--green); color:#fff; border:none;
    border-radius:11px; font-size:16px; font-weight:700; cursor:pointer; }
  .btn:disabled{ background:#bdbdbd; cursor:default; }
  .msg{ text-align:center; font-size:13px; margin:10px 2px 0; min-height:18px; }
  .msg.ok{ color:var(--green); }
  .msg.err{ color:#c62828; }
  .loading{ text-align:center; color:var(--sub); font-size:14px; padding:40px 0; }
  .hint{ font-size:12px; color:#999; margin:2px 2px 12px; }
  .hidden{ display:none !important; }

  /* ★v3.58 担当が決まっている日の印 */
  .cell{ position:relative; }
  .cell .dot{ position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%; background:var(--green); }
  .cell.on .dot{ background:#fff; }
  .legend{ font-size:12px; color:var(--sub); margin:2px 2px 12px; display:flex; align-items:center; gap:6px; }
  .legend i{ width:10px; height:10px; border-radius:50%; background:var(--green); display:inline-block; }
  .asgTitle{ font-size:14px; font-weight:700; margin:16px 2px 8px; }
  .asgDay{ font-size:13px; font-weight:700; margin:10px 2px 4px; }
  .asgItem{ background:#fff; border:1px solid var(--line); border-left:3px solid var(--green);
    border-radius:9px; padding:9px 11px; margin-bottom:6px; }
  .asgItem .nm{ font-size:13px; font-weight:700; }
  .asgItem .tm{ font-size:12px; color:var(--sub); margin-top:2px; }
  .asgItem .wn{ color:#c62828; }

  /* ★v3.46 タブ */
  .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:2px 0 12px; }
  .tab{ padding:11px 6px; border:1px solid var(--line); background:#fff; color:var(--sub);
    border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
  .tab.on{ background:var(--green); border-color:var(--green); color:#fff; }

  /* ★v4.44 マイ予定（自分で順番と時間を変える） */
  .tabs{ grid-template-columns:1fr 1fr 1fr; }
  .tab{ font-size:13px; padding:11px 4px; }
  .pLead{ font-size:12px; color:var(--sub); line-height:1.7; margin:0 2px 12px; }
  .pDay{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 11px; margin-bottom:14px; }
  .pDay.ng{ border-color:#ef9a9a; }
  .pHead{ display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:700; }
  .pBadge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px;
    background:var(--green-l); color:var(--green); }
  .pBadge.ng{ background:#ffebee; color:#c62828; }
  .pWhy{ font-size:12px; color:#c62828; line-height:1.7; margin:8px 0 0; white-space:pre-wrap; }
  .pItem{ display:flex; gap:9px; align-items:flex-start; border-top:1px solid var(--line); padding:11px 0 9px; }
  .pMove{ display:flex; flex-direction:column; gap:4px; flex:none; }
  .pMove button{ width:36px; height:27px; border:1px solid var(--line); background:#fff; border-radius:7px;
    font-size:12px; color:var(--sub); cursor:pointer; padding:0; }
  .pMove button:disabled{ color:#ddd; }
  .pBody{ flex:1; min-width:0; }
  .pNm{ font-size:14px; font-weight:700; line-height:1.4; }
  .pSub{ font-size:11px; color:var(--sub); margin-top:3px; line-height:1.6; }
  .pSub .wn{ color:#c62828; }
  .pLock{ font-size:11px; color:#c62828; margin-top:5px; }
  .pItem select{ margin-top:6px; width:100%; padding:9px; font-size:15px;
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  .pItem select:disabled{ background:#f2f2f2; color:#999; }
  .pActs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .pActs button{ padding:11px 4px; border-radius:10px; font-size:13px; font-weight:700;
    cursor:pointer; border:1px solid var(--green); background:#fff; color:var(--green); }
  .pActs button:disabled{ opacity:.4; }
  .pSave{ margin-top:8px; }
  .pMsg{ font-size:12px; margin-top:9px; text-align:center; min-height:16px;
    white-space:pre-wrap; line-height:1.7; }
  .pMsg.ok{ color:var(--green); }
  .pMsg.err{ color:#c62828; }

  /* ★v3.46 挙手リスト */
  .dateHead{ font-size:14px; font-weight:700; margin:14px 2px 6px; color:var(--ink); }
  .job{ display:flex; align-items:flex-start; gap:10px; background:#fff; border:1px solid var(--line);
    border-radius:11px; padding:11px 12px; margin-bottom:7px; }
  .job.on{ border-color:var(--green); background:var(--green-l); }
  .job.done{ background:#fafafa; color:#999; }
  /* ★v4.17 対応可物件の対象外 */
  .job.oos{ border-color:#ffd8a8; background:#fffdf7; }
  .oospill{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px;
            background:#fff1d6; color:#a06a00; margin-left:6px; vertical-align:middle; font-weight:700; }
  .oosbtn{ display:block; width:100%; margin:14px 0 4px; padding:12px; font-size:14px; font-weight:700;
           background:#fff; color:#2e7d32; border:1px dashed #2e7d32; border-radius:10px; cursor:pointer; }
  .oosnote{ font-size:12px; color:var(--sub); line-height:1.6; margin:6px 2px 0; }
  .job input[type=checkbox]{ width:20px; height:20px; margin-top:2px; flex:none; }
  .job .body{ flex:1; min-width:0; }
  .job .nm{ font-size:14px; font-weight:700; line-height:1.4; }
  .job .sub{ font-size:12px; color:var(--sub); margin-top:3px; }
  .job .warn{ color:#c62828; }
  .job select{ margin-top:7px; width:100%; padding:8px; font-size:14px;
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  .noteBox{ width:100%; padding:10px; font-size:14px; border:1px solid var(--line);
    border-radius:10px; background:#fff; margin-top:6px; font-family:inherit; }
  .secTitle{ font-size:13px; font-weight:700; margin:18px 2px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ★v3.46 タブ切替 -->
  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab on" id="tab-shift" onclick="showTab('shift')">清掃希望日</button>
    <button class="tab" id="tab-hand" onclick="showTab('hand')">挙手する</button>
    <button class="tab" id="tab-plan" onclick="showTab('plan')">マイ予定</button>
  </div>

  <!-- シフト提出（既存） -->
  <div id="view-shift">
    <div id="app">
      <div class="loading" id="loading">読み込み中…</div>
    </div>
  </div>

  <!-- ★v3.46 挙手 -->
  <div id="view-hand" class="hidden">
    <div class="loading" id="h-note">読み込み中…</div>
    <div id="h-list"></div>
    <div id="h-noteWrap" class="hidden">
      <div class="secTitle">連絡事項（任意）</div>
      <textarea class="noteBox" id="h-memo" rows="2" placeholder="例）8/3は13時以降なら入れます"></textarea>
    </div>
  </div>

  <!-- ★v4.44 マイ予定 -->
  <div id="view-plan" class="hidden">
    <div class="pLead">
      担当が決まっている予定です。<b>順番と開始時刻をご自分で変えられます。</b><br>
      回れない並び（重なる／チェックアウト前／同日INに間に合わない）は保存できません。
    </div>
    <div class="loading" id="p-note">読み込み中…</div>
    <div id="p-list"></div>
  </div>
</div>

<!-- シフト提出のフッタ（既存） -->
<div class="bar" id="bar" style="display:none;">
  <div class="count">稼働できる日：<b id="cnt">0</b> 日</div>
  <button class="btn" id="send" onclick="submitShift()">送信する</button>
  <div class="msg" id="msg"></div>
</div>

<!-- ★v3.46 挙手のフッタ -->
<div class="bar hidden" id="h-bar">
  <div class="count">選んだ案件：<b id="h-cnt">0</b> 件</div>
  <button class="btn" id="h-send" onclick="submitHand()">挙手する</button>
  <div class="msg" id="h-msg"></div>
</div>

<script>
  // ============================================================
  //  清掃希望を送信  index.html  v3.69
  //  ・タブ1「清掃希望日」= シフト提出（v3.31のまま。ロジック不変）
  //  ・タブ2「挙手する」  = 未アサイン案件へ挙手（★v3.46 新規）
  //  ・★v3.53 希望開始時刻は「チェックアウト時刻〜22:00」に限定
  //  ・★v3.58 清掃希望日タブに、担当が決まっている予定を表示（印＋一覧）
  //  ・★v3.69 挙手に滞在期間・宿泊人数を表示。同日INも間に合う範囲で時刻を選べる
  //  - GAS: ?mode=shift_get / shift_set / hand_list / hand_submit
  // ============================================================
  var LIFF_ID = '2010751229-9u6958G7';   // 挙手/清掃希望 LIFF(既存)
  // ★このURLは【バージョン固定デプロイ】。clasp push だけでは本番に反映されない。
  //   GAS側を直したら必ず:  clasp deploy -i AKfycbx_ubqKRZeQfNL7qIiElNzE0iTjvq7487Hzx3xor8P4M-u55hF7-EL0n8G-5nYofc_sXg -d "<説明>"
  //   現行: バージョン63 / v4.33 (2026-08-03)  ※-i を省略すると新URLが生成されLIFFが全滅する
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbx_ubqKRZeQfNL7qIiElNzE0iTjvq7487Hzx3xor8P4M-u55hF7-EL0n8G-5nYofc_sXg/exec';
  var RANGE_DAYS = 30;                    // 今日から何日先まで表示するか(GAS側と一致)

  var ME = null;                          // { userId, name }
  var selected = {};                      // { 'YYYY-MM-DD': true }

  var ASSIGNED = {};                      // ★v3.58 { 'YYYY-MM-DD': [{prop,time,state,sameDay}] }
  var HAND_ITEMS = [];                    // ★v3.46 hand_list の結果
  var handDate = {};                      // ★v4.18 ジョブキー -> 希望清掃日(yyyy-MM-dd)
  var HAND_SHOW_ALL = false;              // ★v4.17 対応可物件の対象外も表示するか
  var HAND_OUT_COUNT = 0;                 // ★v4.17 対象外の件数（切替ボタンに出す）
  var handSel = {};                       // ★v3.46 { jobKey: 'HHMM' or '' }
  var handLoaded = false;

  function $(id){ return document.getElementById(id); }
  function closeLiff(){ if (window.liff && liff.isInClient && liff.isInClient()) liff.closeWindow(); }

  // ---- JSONP(report.html と同一パターン) ----
  function jsonp(url){
    return new Promise(function(resolve, reject){
      var cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
      var s = document.createElement('script');
      var timer = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 15000);
      function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
        if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(data){ cleanup(); resolve(data); };
      s.onerror = function(){ cleanup(); reject(new Error('network')); };
      s.src = url + (url.indexOf('?')>=0?'&':'?') + 'callback=' + cb;
      document.body.appendChild(s);
    });
  }

  // ---- 日付ヘルパ ----
  function ymd(d){
    var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), da=('0'+d.getDate()).slice(-2);
    return y+'-'+m+'-'+da;
  }
  function startOfToday(){ var d=new Date(); d.setHours(0,0,0,0); return d; }

  // ============================================================
  //  ★v3.46 タブ切替
  // ============================================================
  // ★v4.44 LINEから ?tab=plan で開かれたら【マイ予定】を最初に出す。
  //   LIFFは liff.line.me/<id>?tab=plan を ?liff.state=%3Ftab%3Dplan の形で渡すことがあるため両対応。
  function initialTab(){
    try{
      var qs = location.search || '';
      var st = /[?&]liff\.state=([^&]*)/.exec(qs);
      if (st) qs = decodeURIComponent(st[1]);
      var m = /[?&]tab=([a-z]+)/.exec(qs);
      if (!m) m = /^\??tab=([a-z]+)/.exec(qs);
      return m ? m[1] : 'shift';
    }catch(e){ return 'shift'; }
  }

  // ★v4.44 3タブ化（清掃希望日 / 挙手する / マイ予定）
  function showTab(name){
    var t = { shift:false, hand:false, plan:false };
    if (!(name in t)) name = 'shift';
    t[name] = true;
    $('view-shift').classList.toggle('hidden', !t.shift);
    $('view-hand').classList.toggle('hidden', !t.hand);
    $('view-plan').classList.toggle('hidden', !t.plan);
    $('tab-shift').classList.toggle('on', t.shift);
    $('tab-hand').classList.toggle('on', t.hand);
    $('tab-plan').classList.toggle('on', t.plan);
    $('bar').style.display = t.shift ? 'block' : 'none';
    $('h-bar').classList.toggle('hidden', !t.hand);
    // 挙手・マイ予定は開くたびに取り直す（他の人に決まった案件・変わった予定を出さないため）
    if (t.hand) loadHandList();
    if (t.plan) loadMyPlan();
  }

  // ============================================================
  //  タブ1: シフト提出（v3.31 のまま・ロジック不変）
  // ============================================================
  function renderCalendar(){
    var app = $('app');
    app.innerHTML = '';

    var hello = document.createElement('div');
    hello.className='hello';
    hello.textContent = 'こんにちは、' + (ME && ME.name ? ME.name : '') + ' さん';
    app.appendChild(hello);

    var lead = document.createElement('div');
    lead.className='lead';
    lead.textContent = '清掃に入れる日をタップして選び、「送信する」を押してください。いつでも変更できます。';
    app.appendChild(lead);

    // ★v3.58 凡例（担当が決まっている日がある時だけ出す）
    if (Object.keys(ASSIGNED).length){
      var lg = document.createElement('div');
      lg.className = 'legend';
      var ic = document.createElement('i');
      lg.appendChild(ic);
      lg.appendChild(document.createTextNode('担当が決まっている日'));
      app.appendChild(lg);
    }

    var today = startOfToday();
    var end = new Date(today.getTime()); end.setDate(today.getDate() + RANGE_DAYS - 1);

    // 月ごとに分割
    var cur = new Date(today.getFullYear(), today.getMonth(), 1);
    var lastMonth = new Date(end.getFullYear(), end.getMonth(), 1);
    while (cur <= lastMonth){
      app.appendChild(buildMonth(cur.getFullYear(), cur.getMonth(), today, end));
      cur.setMonth(cur.getMonth()+1);
    }
    renderAssignedList(app);              // ★v3.58 カレンダーの下に担当予定の一覧
    updateCount();
    $('tabs').style.display = 'grid';     // ★v3.46 準備できてからタブを出す
    $('bar').style.display='block';
  }

  function buildMonth(year, month, today, end){
    var card = document.createElement('div'); card.className='card';
    var title = document.createElement('div'); title.className='monthTitle';
    title.textContent = year + '年' + (month+1) + '月';
    card.appendChild(title);

    var dow = document.createElement('div'); dow.className='dow';
    ['日','月','火','水','木','金','土'].forEach(function(w,i){
      var s=document.createElement('span'); s.textContent=w;
      if(i===0)s.className='sun'; if(i===6)s.className='sat';
      dow.appendChild(s);
    });
    card.appendChild(dow);

    var grid = document.createElement('div'); grid.className='grid';
    var first = new Date(year, month, 1);
    var startDow = first.getDay();           // 0=日
    var daysInMonth = new Date(year, month+1, 0).getDate();

    for (var i=0;i<startDow;i++){
      var e=document.createElement('div'); e.className='cell empty'; grid.appendChild(e);
    }
    for (var d=1; d<=daysInMonth; d++){
      var dt = new Date(year, month, d); dt.setHours(0,0,0,0);
      var cell = document.createElement('div');
      cell.className = 'cell';
      var dow2 = dt.getDay();
      if (dow2===0) cell.classList.add('sun');
      if (dow2===6) cell.classList.add('sat');
      cell.textContent = d;

      // ★v3.58 担当が決まっている日は緑の点を付ける（過去・範囲外にも付ける）
      if (ASSIGNED[ymd(dt)]){
        var dot = document.createElement('span');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      if (dt < today || dt > end){
        cell.classList.add('past');       // 範囲外/過去は選択不可
      } else {
        var key = ymd(dt);
        (function(key, cell){
          if (selected[key]) cell.classList.add('on');
          cell.addEventListener('click', function(){
            if (selected[key]){ delete selected[key]; cell.classList.remove('on'); }
            else { selected[key]=true; cell.classList.add('on'); }
            updateCount();
          });
        })(key, cell);
      }
      grid.appendChild(cell);
    }
    card.appendChild(grid);
    return card;
  }

  // ★v3.58 担当が決まっている予定を日付順に並べる
  function renderAssignedList(app){
    var keys = Object.keys(ASSIGNED).sort();
    if (!keys.length) return;

    var t = document.createElement('div');
    t.className = 'asgTitle';
    t.textContent = '担当が決まっている予定';
    app.appendChild(t);

    var W = ['日','月','火','水','木','金','土'];
    keys.forEach(function(k){
      var p = k.split('-');
      var dt = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      var h = document.createElement('div');
      h.className = 'asgDay';
      h.textContent = (dt.getMonth()+1) + '/' + dt.getDate() + '(' + W[dt.getDay()] + ')';
      app.appendChild(h);

      ASSIGNED[k].forEach(function(it){
        var box = document.createElement('div');
        box.className = 'asgItem';
        var nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = it.prop;
        box.appendChild(nm);
        var tm = document.createElement('div');
        tm.className = 'tm' + (it.sameDay ? ' wn' : '');
        tm.textContent = it.time + (it.sameDay ? '　⚠️同日IN' : '')
                       + (it.state && it.state !== '確定' ? '　※' + it.state : '');
        box.appendChild(tm);
        app.appendChild(box);
      });
    });
  }

  function updateCount(){
    var n = Object.keys(selected).length;
    $('cnt').textContent = n;
  }

  function setMsg(text, cls){
    var m = $('msg');
    m.textContent = text || '';
    m.className = 'msg' + (cls? ' '+cls : '');
  }

  // ---- 送信(shift_set) ----
  function submitShift(){
    if (!ME || !ME.userId){ setMsg('ユーザー情報が取得できていません。', 'err'); return; }
    var btn = $('send');
    btn.disabled = true; setMsg('送信中…','');
    var days = Object.keys(selected).sort().join(',');
    var url = GAS_URL + '?mode=shift_set&userId=' + encodeURIComponent(ME.userId)
            + '&days=' + encodeURIComponent(days);
    jsonp(url).then(function(res){
      btn.disabled = false;
      if (res && res.ok){
        setMsg('送信しました（稼働可能：' + (res.saved!=null?res.saved:Object.keys(selected).length) + '日）', 'ok');
      } else {
        setMsg((res && res.message) ? res.message : '送信に失敗しました。', 'err');
      }
    }).catch(function(){
      btn.disabled = false;
      setMsg('通信エラーが発生しました。もう一度お試しください。', 'err');
    });
  }

  // ★v4.17 対応可物件の対象外を表示するかの切替
  //   通知（募集LINE）は対応可物件で絞ったまま。挙手画面だけ広く見せる。
  //   交通費割増つきの緊急募集など「普段は行かないが今回は行ける」を拾うため。
  function buildScopeToggle(){
    var wrap = document.createElement('div');
    var b = document.createElement('button');
    b.className = 'oosbtn';
    b.textContent = HAND_SHOW_ALL
      ? '− 担当できる物件だけ表示する'

    b.onclick = function(){ HAND_SHOW_ALL = !HAND_SHOW_ALL; loadHandList(); };

  function buildJobRow(it){
    var row = document.createElement('div');
    row.className = 'job' + (it.raised ? ' done' : '') + (it.outOfScope ? ' oos' : '');

    var cbx = document.createElement('input');
    cbx.type = 'checkbox';
    cbx.disabled = !!it.raised;

    var body = document.createElement('div');
    body.className = 'body';

    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = it.propName;
    if (it.outOfScope){                          // ★v4.17
      var pill = document.createElement('span');
      pill.className = 'oospill';
      pill.textContent = '対応外';
      nm.appendChild(pill);
    }
    body.appendChild(nm);

    var sub = document.createElement('div');
    sub.className = 'sub' + (it.sameDay ? ' warn' : '');
    sub.textContent = it.timeLabel +
      (it.sameDay ? ('　⚠️同日IN' + (it.nextIn ? ' ' + it.nextIn : '') + ' に次のお客様') : '');
    body.appendChild(sub);

    // ★v3.69 汚れ具合の目安（滞在期間・宿泊人数）
    var memo = [];
    if (it.stayLabel) memo.push('滞在 ' + it.stayLabel);
    if (it.guests !== '' && it.guests != null) memo.push('宿泊 ' + it.guests + '名');
    if (memo.length){
      var mm = document.createElement('div');
      mm.className = 'sub';
      mm.textContent = memo.join(' ／ ');
      body.appendChild(mm);
    }

    if (it.raised){
      var done = document.createElement('div');
      done.className = 'sub';
      done.textContent = '挙手済み';
      body.appendChild(done);
    }

    // ★v3.69 希望開始時刻の範囲は、チェックアウト 〜 上限（サーバが計算）。
    //   同日IN … 次のお客様のIN時刻から標準清掃時間を引いた「間に合う最も遅い開始」
    //   それ以外 … 22:00
    //   上限が取れない／チェックアウトより早い場合は、時刻を選ばせない。
    var FROM = (typeof it.outMin === 'number' && it.outMin >= 0) ? it.outMin : 600;
    var TO   = (typeof it.maxStartMin === 'number') ? it.maxStartMin : 22 * 60;
    var canPick = (!it.raised && TO >= FROM);

    // ★v4.18 清掃日を選べる案件は日付セレクタを出す。
    //   下限=本来の清掃日／上限=次回IN日 or アウト+3日（サーバが計算）。
    //   日付を変えると「間に合う最も遅い開始」が変わるので、時刻の選択肢を作り直す。
    var dsel = null;
    var DATES = (it.dates && it.dates.length) ? it.dates : [];
    if (!it.raised && DATES.length > 1){
      dsel = document.createElement('select');
      dsel.className = 'hidden';
      DATES.forEach(function(d, i){
        var label = d.label + (i === 0 ? '（本来の清掃日）' : '（後ろ倒し）')
                  + (d.nextInDay ? ' ※次のお客様の到着日' : '');
        dsel.appendChild(new Option(label, d.ymd));
      });
      body.appendChild(dsel);
      var dhint = document.createElement('div');
      dhint.className = 'sub hidden';
      dhint.textContent = '入れる日を選べます。日をずらす場合は、後ほど変更のご連絡をすることがあります。';
      body.appendChild(dhint);
      dsel._hint = dhint;
    }

    var sel = null;
    if (canPick){
      sel = document.createElement('select');
      sel.className = 'hidden';
      sel.appendChild(new Option('開始時刻：おまかせ', ''));

      function fillTimes(to){
        while (sel.options.length > 1) sel.remove(1);
        var mins = [];
        for (var t = FROM; t <= to; t += 30) mins.push(t);
        if (mins.length === 0 || mins[mins.length-1] !== to) mins.push(to);
        mins.forEach(function(t){
          var hh = ('0' + Math.floor(t/60)).slice(-2);
          var mm = ('0' + (t%60)).slice(-2);
          sel.appendChild(new Option(hh + ':' + mm + ' から希望', hh + mm));
        });
      }
      fillTimes(TO);
      // ★v4.18 日付を変えたら、その日の上限で時刻を作り直す
      if (dsel){
        dsel.addEventListener('change', function(){
          handDate[it.key] = dsel.value;
          var d = null;
          for (var i2 = 0; i2 < DATES.length; i2++) if (DATES[i2].ymd === dsel.value) d = DATES[i2];
          var to2 = (d && typeof d.maxStartMin === 'number') ? d.maxStartMin : TO;
          sel.value = '';
          fillTimes(to2);
        });
      }

      sel.addEventListener('change', function(){
        if (handSel[it.key] !== undefined) handSel[it.key] = sel.value;
      });
      body.appendChild(sel);

      var hint = document.createElement('div');
      hint.className = 'sub hidden';
      var hi = ('0' + Math.floor(TO/60)).slice(-2) + ':' + ('0' + (TO%60)).slice(-2);
      hint.textContent = it.sameDay
        ? ('次のお客様に間に合うのは ' + hi + ' 開始まで'
           + (it.stdMin ? '（標準' + (it.stdMin % 60 === 0 ? (it.stdMin/60) + '時間' : it.stdMin + '分') + '）' : ''))
        : ('チェックアウト' + (it.outLabel ? '（' + it.outLabel + '）' : '') + '以降で選べます');
      body.appendChild(hint);
      sel._hint = hint;
    } else if (!it.raised && it.sameDay){
      var ng = document.createElement('div');
      ng.className = 'sub warn';
      ng.textContent = '時間の調整はできません（表示の時間でお願いします）';
      body.appendChild(ng);
    }

    cbx.addEventListener('change', function(){
      if (cbx.checked){
        handSel[it.key] = sel ? sel.value : '';
        handDate[it.key] = dsel ? dsel.value : (DATES.length ? DATES[0].ymd : '');   // ★v4.18
        row.classList.add('on');
        if (sel){ sel.classList.remove('hidden'); if (sel._hint) sel._hint.classList.remove('hidden'); }
        if (dsel){ dsel.classList.remove('hidden'); if (dsel._hint) dsel._hint.classList.remove('hidden'); }
      } else {
        delete handSel[it.key];
        delete handDate[it.key];                                                     // ★v4.18
        row.classList.remove('on');
        if (sel){ sel.classList.add('hidden'); if (sel._hint) sel._hint.classList.add('hidden'); }
        if (dsel){ dsel.classList.add('hidden'); if (dsel._hint) dsel._hint.classList.add('hidden'); }
      }
      updateHandCount();
    });

    row.appendChild(cbx);
    row.appendChild(body);
    return row;
  }

  function updateHandCount(){
    $('h-cnt').textContent = Object.keys(handSel).length;
  }

  function submitHand(){
    if (!ME || !ME.userId){ setHandMsg('ユーザー情報が取得できていません。', 'err'); return; }
    var keys = Object.keys(handSel);
    if (!keys.length){ setHandMsg('入れる案件にチェックを入れてください。', 'err'); return; }

    var btn = $('h-send');
    btn.disabled = true; setHandMsg('送信中…','');

    // ★v4.18 ジョブキー|希望開始時刻|希望清掃日
    var items = keys.map(function(k){ return k + '|' + (handSel[k] || '') + '|' + (handDate[k] || ''); }).join(',');
    var note = ($('h-memo').value || '').trim().slice(0, 200);

    var url = GAS_URL + '?mode=hand_submit&userId=' + encodeURIComponent(ME.userId)

    jsonp(url).then(function(res){

        btn.classList.add('hidden');
        setTimeout(closeLiff, 2600);
      } else {
        setHandMsg((res && res.message) ? res.message : '送信に失敗しました。', 'err');
      }
    }).catch(function(){
      btn.disabled = false;
      setHandMsg('送信に失敗しました。電波の良い場所で再度お試しください。\n受付できたかどうかはLINEの通知でご確認ください。', 'err');
    });
  }

  // ============================================================
  //  ★v4.44 タブ3: マイ予定
  //    ・自分の担当の【順番】と【開始時刻】を、この画面で直接変える
  //    ・▲▼で順番を入れ替えると、時刻は自動で詰め直す（移動時間を挟む）
  //    ・回れない並びは保存させない（サーバ側でも同じ検査をする）
  //    ・2名で入る予定／開始を報告済みの予定は動かせない（🔒）
  //  GAS: ?mode=myplan_get / myplan_set
  // ============================================================
  var PLAN_DAYS = [];       // myplan_get の days
  var PLAN_TRAVEL = 30;     // 現場間の移動時間(分)
  var PLAN_STEP = 15;       // 時刻の刻み(分)
  var planBusy = false;

  function hm2m(v){
    var m = String(v||'').match(/^(\d{1,2}):(\d{2})$/);
    return m ? (Number(m[1])*60 + Number(m[2])) : null;
  }
  function m2hm(v){
    var t = ((Math.round(v) % 1440) + 1440) % 1440;
    return ('0'+Math.floor(t/60)).slice(-2) + ':' + ('0'+(t%60)).slice(-2);
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function loadMyPlan(){
    $('p-note').classList.remove('hidden');
    $('p-note').textContent = '読み込み中…';
    $('p-list').innerHTML = '';
    jsonp(GAS_URL + '?mode=myplan_get&userId=' + encodeURIComponent(ME.userId))
      .then(function(res){
        if (!res || !res.ok){
          $('p-note').innerHTML = esc((res && res.message) || '読み込みに失敗しました。');
          return;
        }
        PLAN_DAYS = res.days || [];
        if (res.travel) PLAN_TRAVEL = res.travel;
        if (res.step) PLAN_STEP = res.step;
        if (!PLAN_DAYS.length){
          $('p-note').innerHTML = 'いまのところ、担当が決まっている予定はありません。<br>「挙手する」から希望を出せます。';
          return;
        }
        $('p-note').classList.add('hidden');
        renderPlan();
      })
      .catch(function(){
        $('p-note').textContent = '通信に失敗しました。電波の良い場所で開き直してください。';
      });
  }

  // ★v4.46 2件のあいだの移動時間。
  //   サーバが Googleマップの実測（移動手段ぶんも反映済み）を tmap で渡してくる。
  //   実測が取れなかった組だけ、保険の定数を使う。
  //   一律の定数だと「第一A → 第一B」でも60分あける判定になり、提案が信用されなくなる。
  function travelBetween(d, a, b){
    if (!a || !b) return PLAN_TRAVEL;
    if (d && d.tmap && a.key && b.key){
      var v = d.tmap[a.key + '>' + b.key];
      if (v != null && isFinite(v)) return v;
    }
    return PLAN_TRAVEL;
  }

  // 現在の並びが回れるか（サーバ側 _spWhyBad_ と同じ判定）
  function planCheck(d){
    var arr = d.items.slice().sort(function(a,b){
      return (hm2m(a.start)==null?9999:hm2m(a.start)) - (hm2m(b.start)==null?9999:hm2m(b.start));
    });
    var out = [], prevEnd = null, prevNm = '', prevIt = null;
    for (var i=0;i<arr.length;i++){
      var it = arr[i], cur = hm2m(it.start);
      if (cur == null){ out.push('・' + it.prop + ' の開始時刻が入っていません'); continue; }
      var early = hm2m(it.min);
      if (early != null && cur < early){
        out.push('・' + it.prop + ' はチェックアウト前（' + it.min + '）に始まる予定です');
      }
      var late = hm2m(it.max);
      if (it.dur > 0 && late != null && cur > late){
        out.push(it.sameDay
          ? ('・' + it.prop + ' は同日IN ' + it.inTime + ' に間に合いません（' + m2hm(cur+it.dur) + ' 終了予定）')
          : ('・' + it.prop + ' の開始が遅すぎます'));
      }
      var tv = travelBetween(d, prevIt, it);
      if (prevEnd != null && cur < prevEnd + tv){
        out.push('・' + prevNm + ' と ' + it.prop + ' が重なっています（移動 ' + tv +
                 '分を含めて ' + m2hm(prevEnd + tv) + ' 以降）');
      }
      prevEnd = cur + (it.dur>0?it.dur:0);
      prevNm = it.prop;
      prevIt = it;
    }
    return out.join('\n');
  }

  // いまの並び順のまま、時刻を先頭から詰め直す（🔒は動かさない）
  function planReflow(di){
    var d = PLAN_DAYS[di], t = null, prevIt = null;
    d.items.forEach(function(it, i){
      var early = hm2m(it.min);
      if (early == null) early = 0;
      var s;
      if (it.locked){
        s = hm2m(it.start);
        if (s == null) s = early;
      } else {
        var want = (i === 0) ? (hm2m(it.start) == null ? early : hm2m(it.start)) : t;
        s = Math.max(want, early, (t == null ? 0 : t));
        s = Math.ceil(s / PLAN_STEP) * PLAN_STEP;
      }
      it.start = m2hm(s);
      it.end = (it.dur > 0) ? m2hm(s + it.dur) : '';
      t = s + (it.dur > 0 ? it.dur : 0);
      prevIt = it;
      // 次の現場までの移動は「次がどこか」で変わる
      var nx = d.items[i+1];
      if (nx) t += travelBetween(d, prevIt, nx);
    });
    renderPlan(di);
  }

  // サーバが出した「おすすめ」を入れる
  function planSuggest(di){
    var d = PLAN_DAYS[di];
    if (!d.suggest || !d.suggest.length){ setPlanMsg(di, 'おすすめを計算できませんでした。', 'err'); return; }
    var by = {};
    d.suggest.forEach(function(s){ by[s.key] = s.start; });
    d.items.forEach(function(it){
      if (it.locked) return;
      if (by[it.key]) { it.start = by[it.key]; it.end = (it.dur>0) ? m2hm(hm2m(by[it.key]) + it.dur) : ''; }
    });
    d.items.sort(function(a,b){ return hm2m(a.start) - hm2m(b.start); });
    renderPlan(di);
    setPlanMsg(di, 'おすすめの順番を入れました。内容を確認して保存してください。', 'ok');
  }

  function planMove(di, i, dir){
    var d = PLAN_DAYS[di], j = i + dir;
    if (j < 0 || j >= d.items.length) return;
    var tmp = d.items[i]; d.items[i] = d.items[j]; d.items[j] = tmp;
    planReflow(di);
  }

  function planTime(di, i, val){
    var it = PLAN_DAYS[di].items[i];
    it.start = val || '';
    it.end = (val && it.dur > 0) ? m2hm(hm2m(val) + it.dur) : '';
    renderPlan(di);
  }

  function setPlanMsg(di, text, cls){
    var m = $('p-msg-' + di);
    if (!m) return;
    m.textContent = text || '';
    m.className = 'pMsg' + (cls ? ' ' + cls : '');
  }

  function planOptions(it){
    var lo = hm2m(it.min); if (lo == null) lo = 6*60;
    var hi = hm2m(it.max); if (hi == null) hi = 22*60;
    if (hi < lo) hi = lo;
    var cur = hm2m(it.start);
    var vals = [];
    for (var v = Math.floor(lo/PLAN_STEP)*PLAN_STEP; v <= hi; v += PLAN_STEP) vals.push(v);
    if (cur != null && vals.indexOf(cur) < 0) { vals.push(cur); vals.sort(function(a,b){return a-b;}); }
    // ★開始時刻が未定のときは「選んでください」を先頭に出す。
    //   これを出さないと、見た目は先頭の時刻が選ばれているのに中身は空、という食い違いになる。
    var head = (cur == null) ? '<option value="" selected>― 時刻を選んでください ―</option>' : '';
    return head + vals.map(function(v){
      return '<option value="' + m2hm(v) + '"' + (v===cur?' selected':'') + '>' + m2hm(v) +
             (it.dur>0 ? ' 〜 ' + m2hm(v+it.dur) : '') + '</option>';
    }).join('');
  }

  function renderPlan(only){
    var host = $('p-list');
    if (only == null) host.innerHTML = '';
    PLAN_DAYS.forEach(function(d, di){
      if (only != null && only !== di) return;
      var why = planCheck(d);
      var html = '';
      html += '<div class="pHead"><span>' + esc(d.label) + '</span>' +
              '<span class="pBadge' + (why?' ng':'') + '">' + (why ? '⚠️ 回れません' : '✅ 回れます') + '</span></div>';
      if (why) html += '<div class="pWhy">' + esc(why) + '</div>';

      d.items.forEach(function(it, i){
        var sub = [];
        if (it.durLabel) sub.push('所要 ' + esc(it.durLabel));
        if (it.out) sub.push('OUT ' + esc(it.out));
        if (it.sameDay && it.inTime) sub.push('<span class="wn">同日IN ' + esc(it.inTime) + '</span>');
        // ★v4.47 自分が挙手で出した希望時刻。こちらの組み直しでは動かさない印。
        if (it.wish) sub.push('希望 ' + esc(it.wish));
        html += '<div class="pItem">' +
          '<div class="pMove">' +
            '<button onclick="planMove(' + di + ',' + i + ',-1)"' + (i===0?' disabled':'') + '>▲</button>' +
            '<button onclick="planMove(' + di + ',' + i + ',1)"' + (i===d.items.length-1?' disabled':'') + '>▼</button>' +
          '</div>' +
          '<div class="pBody">' +
            '<div class="pNm">' + (i+1) + '. ' + esc(it.prop) + '</div>' +
            '<div class="pSub">' + sub.join('　/　') + '</div>' +
            '<select ' + (it.locked?'disabled':'') +
              ' onchange="planTime(' + di + ',' + i + ',this.value)">' + planOptions(it) + '</select>' +
            (it.locked ? '<div class="pLock">🔒 ' + esc(it.lockReason) + '</div>' : '') +
          '</div></div>';
      });

      html += '<div class="pActs">' +
        '<button onclick="planSuggest(' + di + ')">✨ おすすめの順番</button>' +
        '<button onclick="planReflow(' + di + ')">⏱ 時間を詰め直す</button>' +
        '</div>' +
        '<button class="btn pSave" id="p-save-' + di + '" onclick="planSave(' + di + ')">この日の予定を保存する</button>' +
        '<div class="pMsg" id="p-msg-' + di + '"></div>';

      var box = (only != null) ? $('p-day-' + di) : document.createElement('div');
      if (only == null){
        box.id = 'p-day-' + di;
        host.appendChild(box);
      }
      box.className = 'pDay' + (why ? ' ng' : '');
      box.innerHTML = html;
    });
  }

  function planSave(di){
    if (planBusy) return;
    var d = PLAN_DAYS[di];
    // システム上のキーが無い案件があると、どの行を直せばよいか特定できない
    var noKey = d.items.filter(function(it){ return !it.key; });
    if (noKey.length){
      setPlanMsg(di, 'この日の案件にシステム上の不備があるため保存できません。\nこのトークにそのままご返信ください。', 'err');
      return;
    }
    var why = planCheck(d);
    if (why){ setPlanMsg(di, 'この並びでは回れません。\n' + why, 'err'); return; }

    var plan = d.items.slice().sort(function(a,b){ return hm2m(a.start) - hm2m(b.start); })
      .map(function(it){ return it.key + ':' + String(it.start).replace(':',''); }).join(',');

    planBusy = true;
    var btn = $('p-save-' + di);
    if (btn){ btn.disabled = true; btn.textContent = '保存しています…'; }
    setPlanMsg(di, '', '');

    jsonp(GAS_URL + '?mode=myplan_set&userId=' + encodeURIComponent(ME.userId)
        + '&ymd=' + encodeURIComponent(d.ymd)
        + '&plan=' + encodeURIComponent(plan))
      .then(function(res){
        planBusy = false;
        if (btn){ btn.disabled = false; btn.textContent = 'この日の予定を保存する'; }
        if (!res || !res.ok){
          setPlanMsg(di, (res && res.message) || '保存に失敗しました。', 'err');
          return;
        }
        setPlanMsg(di, res.message || '保存しました。', 'ok');
      })
      .catch(function(){
        planBusy = false;
        if (btn){ btn.disabled = false; btn.textContent = 'この日の予定を保存する'; }
        setPlanMsg(di, '通信に失敗しました。保存できたかどうかは、画面を開き直してご確認ください。', 'err');
      });
  }

  // ---- 起動(report.html と同じ初期化フロー) ----
  (async function init(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()){ liff.login(); return; }
      var prof = await liff.getProfile();
      ME = { userId: prof.userId, name: prof.displayName };

      // 前回提出を取得してONを復元
      try{
        var res = await jsonp(GAS_URL + '?mode=shift_get&userId=' + encodeURIComponent(ME.userId));
        if (res && res.ok && Array.isArray(res.days)){
          res.days.forEach(function(d){ selected[d] = true; });
        } else if (res && res.ok === false){
          // スタッフ未登録など。カレンダーは出すが注意表示。
          $('loading').innerHTML =
            (res.message || 'スタッフ情報が確認できませんでした。マネージャーへご連絡ください。');
          return;
        }
      }catch(e){ /* 取得失敗でも空で続行 */ }

      // ★v3.58 担当が決まっている予定を取得（失敗しても画面は出す）
      try{
        var ra = await jsonp(GAS_URL + '?mode=assign_get&userId=' + encodeURIComponent(ME.userId));
        if (ra && ra.ok && ra.days) ASSIGNED = ra.days;
      }catch(e2){ /* 取得失敗でも空で続行 */ }

      renderCalendar();

      // ★v4.44 ?tab=plan で開かれたらマイ予定を表示する
      try{
        var t0 = initialTab();
        if (t0 === 'plan' || t0 === 'hand') showTab(t0);
      }catch(eT){ /* 失敗しても既定タブのまま */ }
    }catch(e){
      $('loading').innerHTML =
        'LINEアプリ内で開いてください。<br>（このページはLINEのリッチメニューから開きます）';
    }
  })();
</script>
